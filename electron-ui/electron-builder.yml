appId: com.anthropic.claude-code-ui
productName: Claude Code UI
copyright: © 2024 Anthropic PBC

npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/test/**"

extraResources:
  - from: "../package"
    to: "cli"
    filter:
      - "**/*"
  # Icons are read at runtime from `resources/build` (see resolveBuildAsset in
  # src/main/index.ts) — `files` only ships dist/ and node_modules/, so without
  # this the window and tray icons would be missing in packaged builds.
  - from: "build"
    to: "build"
    filter:
      - "icon.ico"
      - "icon.png"
      - "tray.png"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "Claude Code UI"

asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"
