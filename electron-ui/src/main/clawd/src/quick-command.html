<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Local-only page: no image, font, fetch or media sources. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* Same SAO HUD grammar as the pet menu and the notice centre: a near-black
   translucent slab, cut corners, faint grid, one teal accent, uppercase
   monospace chrome. The window is transparent — only the panel draws. */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Author `display` rules outrank the UA [hidden] rule; make the attribute
   authoritative for the progress line and the inline error. */
[hidden] { display: none !important; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: "Cascadia Code", "SF Mono", ui-monospace, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

:root {
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --text: #dff7f3;
  --muted: #7fa8a2;
  --accent: #3fe0c8;
  --line: rgba(63, 224, 200, 0.28);
  --line-soft: rgba(63, 224, 200, 0.05);
  --field-bg: rgba(63, 224, 200, 0.035);
  --field-border: rgba(63, 224, 200, 0.16);
  --field-focus: rgba(63, 224, 200, 0.5);
  --row-line: rgba(63, 224, 200, 0.1);
  --row-active: rgba(63, 224, 200, 0.09);
  --error: #ff8b8b;
  --warn: #f0b429;
  --panel-bg:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
    linear-gradient(180deg, rgba(8, 14, 20, 0.94), rgba(4, 10, 14, 0.97));
  --panel-size: 100% 22px, 22px 100%, 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: inset 0 0 28px rgba(63, 224, 200, 0.05);
  --panel-radius: 0;
  --panel-clip: polygon(
    0 12px, 12px 0,
    calc(100% - 18px) 0, 100% 18px,
    100% calc(100% - 10px), calc(100% - 10px) 100%,
    18px 100%, 0 calc(100% - 18px)
  );
  --text-shadow: 0 0 12px rgba(63, 224, 200, 0.10);
}

/* The pet's other bubble skin. Same information, the app's neutral card:
   rounded, no clipped corners, system light/dark. */
body[data-theme="clawd"] {
  --text: #18181b;
  --muted: #71717a;
  --accent: #d97757;
  --line: rgba(0, 0, 0, 0.10);
  --line-soft: transparent;
  --field-bg: rgba(0, 0, 0, 0.03);
  --field-border: rgba(0, 0, 0, 0.12);
  --field-focus: rgba(217, 119, 87, 0.55);
  --row-line: rgba(0, 0, 0, 0.08);
  --row-active: rgba(0, 0, 0, 0.05);
  --error: #b42318;
  --warn: #a15c07;
  --panel-bg: linear-gradient(180deg, #fbfbfa, #f4f4f2);
  --panel-size: 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --panel-radius: 16px;
  --panel-clip: none;
  --text-shadow: none;
}
@media (prefers-color-scheme: dark) {
  body[data-theme="clawd"] {
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #d97757;
    --line: rgba(255, 255, 255, 0.10);
    --field-bg: #09090b;
    --field-border: rgba(255, 255, 255, 0.08);
    --field-focus: rgba(217, 119, 87, 0.65);
    --row-line: rgba(255, 255, 255, 0.07);
    --row-active: rgba(255, 255, 255, 0.07);
    --error: #fca5a5;
    --warn: #fbbf24;
    --panel-bg: linear-gradient(180deg, #1b1b1e, #18181b);
    --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
}

body { padding: 8px; }

/* ── Panel ────────────────────────────────────────────────────────────────── */
.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  padding: 10px 12px 11px;
  color: var(--text);
  background: var(--panel-bg);
  background-size: var(--panel-size);
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-radius);
  clip-path: var(--panel-clip);
  filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.45));
  box-shadow: var(--panel-shadow);
  text-shadow: var(--text-shadow);
  opacity: 0;
  transform: translateY(5px) scale(0.99);
  transition: opacity 0.14s linear, transform 0.18s var(--ease);
}
.panel.visible { opacity: 1; transform: none; }

/* A slow sweep of light, purely decorative, under the content. Only the HUD
   skin has it; the neutral card keeps its plain surface. */
.scan {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 30%;
  pointer-events: none;
  display: none;
  background: linear-gradient(180deg, rgba(63, 224, 200, 0.10), transparent);
  animation: hudScan 5.5s linear infinite;
}
body[data-theme="sao"] .scan { display: block; }
@keyframes hudScan {
  0%   { transform: translateY(-120%); opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(420%); opacity: 0; }
}

.head, .field, .error, .foot { position: relative; z-index: 1; }

/* ── Head ─────────────────────────────────────────────────────────────────── */
.head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: 0 2px 7px;
  border-bottom: 1px solid rgba(63, 224, 200, 0.14);
}
body[data-theme="clawd"] .head { border-bottom-color: var(--line); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before {
  content: "";
  width: 5px;
  height: 5px;
  transform: rotate(45deg);
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  flex: none;
}
body[data-theme="clawd"] .eyebrow::before { box-shadow: none; border-radius: 1px; }
.spacer { flex: 1; }
.status {
  flex: none;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Target chip ─────────────────────────────────────────────────────────────
   One control, one word: does Enter continue the conversation the user is in,
   or start a new one? The name is the thread title when the store has one.
   With no target this is a disabled label, not a dead button. */
.target {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  max-width: 240px;
  flex: 0 1 auto;
  padding: 2px 6px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease;
}
body[data-theme="clawd"] .target {
  border-radius: 7px;
  font-size: 9px;
  letter-spacing: 0.02em;
  text-transform: none;
}
.target:hover:not(:disabled),
.target:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}
.target[data-mode="continue"] { border-color: var(--line); color: var(--text); }
.target[data-mode="continue"] .target-mode { color: var(--accent); }
.target:disabled { cursor: default; }
.target:disabled:hover { border-color: var(--field-border); color: var(--muted); }
.target[data-mode="continue"]:disabled:hover { color: var(--text); }
.target-mode { flex: none; }
.target-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: none;
  opacity: 0.88;
}
.target-dot { flex: none; opacity: 0.55; }
.target-swap { flex: none; font-size: 9px; opacity: 0.55; }

/* ── Input ────────────────────────────────────────────────────────────────── */
.field {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  height: 34px;
  margin-top: 7px;
  padding: 0 9px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}
body[data-theme="clawd"] .field { clip-path: none; border-radius: 9px; }
.field:focus-within {
  border-color: var(--field-focus);
  background: var(--field-bg);
  box-shadow: inset 0 0 14px rgba(63, 224, 200, 0.07);
}
body[data-theme="clawd"] .field:focus-within { box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.12); }
.prompt {
  flex: none;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  opacity: 0.9;
}
#input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.01em;
  caret-color: var(--accent);
  user-select: text;
}
#input::placeholder { color: var(--muted); opacity: 0.8; }
#input:disabled { opacity: 0.62; cursor: default; }

/* ── Error / busy line ────────────────────────────────────────────────────── */
.error {
  flex: none;
  min-height: 13px;
  margin-top: 5px;
  padding-left: 7px;
  border-left: 2px solid var(--error);
  font-size: 9.5px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  color: var(--error);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.error[data-kind="empty"] { color: var(--warn); border-left-color: var(--warn); }
.error[data-kind="busy"] { color: var(--warn); border-left-color: var(--warn); }

/* ── Recent asks ──────────────────────────────────────────────────────────────
   Shown only while the field is empty. The micro-label and hairline rows use
   the same HUD grammar as the meta rows; the window grows by this block's
   measured height so the panel never clips it. */
.suggest {
  position: relative;
  z-index: 1;
  flex: none;
  margin-top: 7px;
}
.suggest-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px 4px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.suggest-label::before {
  content: "";
  flex: none;
  width: 12px;
  height: 1px;
  background: var(--accent);
  opacity: 0.65;
}
body[data-theme="clawd"] .suggest-label {
  font-size: 9px;
  letter-spacing: 0.02em;
  text-transform: none;
}
.suggest-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}
body[data-theme="clawd"] .suggest-list { gap: 2px; border-top: 0; }
.suggest-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 28px;
  padding: 0 6px 0 8px;
  border: 0;
  border-bottom: 1px solid var(--row-line);
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.01em;
  text-align: left;
  cursor: pointer;
  outline: none;
  animation: suggestIn 190ms var(--ease) both;
  animation-delay: calc(var(--i, 0) * 34ms);
  transition: background 120ms ease;
}
.suggest-row:last-child { border-bottom: 0; }
.suggest-row:hover,
.suggest-row:focus-visible { background: var(--row-active); }
.suggest-row[aria-selected="true"] {
  background: var(--row-active);
  box-shadow: inset 2px 0 0 var(--accent);
}
body[data-theme="clawd"] .suggest-row {
  font-size: 12px;
  border-bottom: 0;
  border-radius: 6px;
}
body[data-theme="clawd"] .suggest-row[aria-selected="true"] {
  box-shadow: inset 0 0 0 1px var(--line);
}
.suggest-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.suggest-age {
  flex: none;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
}
body[data-theme="clawd"] .suggest-age {
  font-size: 9px;
  letter-spacing: 0.01em;
  text-transform: none;
}
@keyframes suggestIn {
  from { opacity: 0; transform: translateX(-5px); }
  to   { opacity: 1; transform: none; }
}

/* ── Footer ───────────────────────────────────────────────────────────────── */
.foot {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
  margin-top: auto;
  padding: 0 2px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.hint { display: inline-flex; align-items: center; gap: 5px; }
kbd {
  font: inherit;
  font-size: 8px;
  padding: 1px 4px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  color: var(--text);
  opacity: 0.85;
}
.spacer2 { flex: 1; }
.aipa { opacity: 0.55; }

/* ── Progress ────────────────────────────────────────────────────────────── */
.progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  overflow: hidden;
  background: rgba(63, 224, 200, 0.08);
  z-index: 2;
}
.progress span {
  display: block;
  width: 38%;
  height: 100%;
  background: var(--accent);
  opacity: 0.85;
  animation: cmdSweep 1.1s ease-in-out infinite;
}
@keyframes cmdSweep {
  0%   { transform: translateX(-110%); }
  100% { transform: translateX(320%); }
}

@media (prefers-reduced-motion: reduce) {
  .panel { transition: none; }
  .target { transition: none; }
  .suggest-row { animation: none; transition: none; }
  .scan { animation: none; opacity: 0.35; }
  .progress span { animation: none; width: 100%; opacity: 0.35; }
}
</style>
</head>
<body data-theme="sao">
<div class="panel" id="panel" role="dialog" aria-modal="false">
  <div class="scan" aria-hidden="true"></div>
  <div class="head">
    <span class="eyebrow" id="eyebrow">ASK</span>
    <button class="target" id="target" type="button" data-mode="new">
      <span class="target-mode" id="targetMode">New conversation</span>
      <span class="target-dot" id="targetDot" aria-hidden="true" hidden>·</span>
      <span class="target-name" id="targetName" hidden></span>
      <span class="target-swap" id="targetSwap" aria-hidden="true" hidden>⇄</span>
    </button>
    <span class="spacer"></span>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <form class="field" id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="input" type="text" spellcheck="false" autocomplete="off"
           aria-label="Quick command" />
  </form>
  <div class="suggest" id="suggest" hidden>
    <div class="suggest-label" id="suggestLabel"></div>
    <div class="suggest-list" id="suggestList" role="listbox"></div>
  </div>
  <div class="error" id="error" role="alert" hidden></div>
  <div class="foot">
    <span class="hint" id="historyHint" hidden><kbd>↑</kbd><span id="historyHintText"></span></span>
    <span class="hint"><kbd>Enter</kbd><span id="sendHint">Send</span></span>
    <span class="hint"><kbd>Esc</kbd><span id="cancelHint">Cancel</span></span>
    <span class="spacer2"></span>
    <span class="aipa">AIPA</span>
  </div>
  <div class="progress" id="progress" hidden aria-hidden="true"><span></span></div>
</div>
<script>
(function () {
  "use strict";

  var api = window.quickCommandAPI || null;
  var panel = document.getElementById("panel");
  var eyebrow = document.getElementById("eyebrow");
  var status = document.getElementById("status");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var errorEl = document.getElementById("error");
  var progress = document.getElementById("progress");
  var sendHint = document.getElementById("sendHint");
  var cancelHint = document.getElementById("cancelHint");
  var targetEl = document.getElementById("target");
  var targetMode = document.getElementById("targetMode");
  var targetDot = document.getElementById("targetDot");
  var targetName = document.getElementById("targetName");
  var targetSwap = document.getElementById("targetSwap");
  var suggestEl = document.getElementById("suggest");
  var suggestLabel = document.getElementById("suggestLabel");
  var suggestList = document.getElementById("suggestList");
  var historyHintEl = document.getElementById("historyHint");
  var historyHintText = document.getElementById("historyHintText");

  var labels = {
    ask: "Quick command",
    placeholder: "Type a command or question…",
    send: "Enter to send",
    cancel: "Esc to cancel",
    starting: "Starting…",
    empty: "Type a command first",
    busy: "A turn is already running. Stop it or wait for it to finish.",
    failed: "Could not start the turn",
    turnFailed: "The turn failed.",
    replyTitle: "Quick answer",
    replyPill: "REPLY",
    noReply: "(no text reply)",
    errorTitle: "Quick command failed",
    errorPill: "ERROR",
    metaTime: "TIME",
    metaTools: "TOOLS",
    continueChip: "Continue",
    newChip: "New conversation",
    switchToNew: "Click to start a new conversation",
    switchToContinue: "Click to continue this conversation",
    continueFailed: "Could not continue this conversation",
    continueUnavailable: "That conversation can no longer be continued. Start a new one instead.",
    untitledThread: "Untitled conversation",
    // Filled from i18n.js by main on every open; empty here so no English
    // string is baked into this page.
    historyLabel: "",
    historyHint: ""
  };

  var ready = false;
  var pending = false;
  var composing = false;
  // True only for the keystroke that confirmed an IME composition. The submit
  // event fires during that same keydown, before the flag can be cleared.
  var imeEnter = false;
  // Captured by main on open, reset on every open. The page only chooses a
  // mode; it never sees or sends the thread id.
  var target = { canContinue: false, mode: "new", label: "" };
  // Newest first. Main sends all of it; the list shows the first five.
  var history = [];
  // Suggestion row under the keyboard, -1 for none. Distinct from recallIndex:
  // ↑ pulls history into the field, ↓ selects a row in the list.
  var selected = -1;
  // -1 = the draft; 0 = newest history entry. Increasing walks back in time.
  var recallIndex = -1;
  // What the field held when the walk began, restored at the bottom.
  var draft = "";
  // Last extra height sent to main, so idle keystrokes do not spam resize.
  var lastExtra = -1;
  var ageFormat = null;
  var SUGGEST_LIMIT = 5;

  function applyLabels() {
    eyebrow.textContent = labels.ask;
    input.placeholder = labels.placeholder;
    input.setAttribute("aria-label", labels.placeholder);
    sendHint.textContent = labels.send;
    cancelHint.textContent = labels.cancel;
    suggestLabel.textContent = labels.historyLabel;
    suggestList.setAttribute("aria-label", labels.historyLabel);
    historyHintText.textContent = labels.historyHint;
    panel.setAttribute("aria-label", labels.ask);
  }

  /**
   * Paint the one-word decision. `CONTINUE · <name>` when the captured target
   * exists, otherwise `NEW CONVERSATION`. The chip is a real button only when
   * there is something to switch to; with one state it is a disabled label and
   * still says what Enter will do.
   */
  function renderTarget() {
    var cont = target.canContinue && target.mode === "continue";
    var name = cont ? (target.label || labels.untitledThread) : "";
    targetEl.dataset.mode = cont ? "continue" : "new";
    targetMode.textContent = cont ? labels.continueChip : labels.newChip;
    targetName.textContent = name;
    targetName.hidden = !name;
    targetDot.hidden = !name;
    targetSwap.hidden = !target.canContinue;
    targetEl.title = cont
      ? labels.switchToNew
      : (target.canContinue ? labels.switchToContinue : "");
    targetEl.disabled = pending || !target.canContinue;
  }

  function clearError() {
    errorEl.hidden = true;
    errorEl.textContent = "";
    errorEl.removeAttribute("data-kind");
  }

  function showError(message, kind) {
    errorEl.textContent = message || labels.failed;
    errorEl.dataset.kind = kind || "error";
    errorEl.hidden = false;
  }

  function suggestVisible() {
    return !pending && history.length > 0 && input.value.length === 0;
  }

  /**
   * Relative age without baking units into the page: Intl knows them for the
   * language main put on <html>. An entry without a usable timestamp simply
   * gets no age badge.
   */
  function ageFormatter() {
    if (ageFormat) return ageFormat;
    if (typeof Intl === "undefined" || typeof Intl.RelativeTimeFormat !== "function") return null;
    try {
      ageFormat = new Intl.RelativeTimeFormat(document.documentElement.lang || "en", {
        numeric: "auto",
        style: "short"
      });
    } catch (err) {
      ageFormat = null;
    }
    return ageFormat;
  }

  function formatAge(at) {
    if (typeof at !== "number" || !isFinite(at) || at <= 0) return "";
    var format = ageFormatter();
    if (!format) return "";
    var seconds = Math.max(0, Math.round((Date.now() - at) / 1000));
    if (seconds < 45) return format.format(0, "second");
    var minutes = Math.round(seconds / 60);
    if (minutes < 60) return format.format(-minutes, "minute");
    var hours = Math.round(minutes / 60);
    if (hours < 24) return format.format(-hours, "hour");
    return format.format(-Math.round(hours / 24), "day");
  }

  function placeCaretAtEnd() {
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {
      /* the field may be disabled mid-render */
    }
  }

  /**
   * Ask main for exactly the space the list occupies. It owns the ceiling and
   * the work-area clamp; sending the measurement keeps the panel from clipping
   * when the list is shorter than its five-row maximum.
   */
  function requestHeight() {
    var extra = 0;
    if (!suggestEl.hidden) {
      var margin = parseFloat(window.getComputedStyle(suggestEl).marginTop) || 0;
      extra = Math.round(suggestEl.getBoundingClientRect().height + margin);
    }
    if (extra === lastExtra) return;
    lastExtra = extra;
    if (api && typeof api.resize === "function") api.resize(extra);
  }

  function applySelection() {
    var rows = suggestList.children;
    for (var i = 0; i < rows.length; i++) {
      rows[i].setAttribute("aria-selected", i === selected ? "true" : "false");
    }
    if (selected >= 0 && rows[selected]) {
      try { rows[selected].scrollIntoView({ block: "nearest" }); } catch (err) {
        /* no scrolling surface in this window */
      }
    }
  }

  function buildSuggestionRow(entry, index) {
    var row = document.createElement("button");
    row.type = "button";
    row.className = "suggest-row";
    row.tabIndex = -1;
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", "false");
    row.style.setProperty("--i", String(index));

    var text = document.createElement("span");
    text.className = "suggest-text";
    text.textContent = entry.text;

    var age = document.createElement("span");
    age.className = "suggest-age";
    age.textContent = formatAge(entry.at);

    row.appendChild(text);
    if (age.textContent) row.appendChild(age);
    row.addEventListener("click", function (event) {
      event.preventDefault();
      insertFromSuggestion(index);
    });
    return row;
  }

  function renderSuggestions() {
    if (!suggestVisible()) {
      suggestEl.hidden = true;
      selected = -1;
      if (suggestList.childNodes.length) suggestList.replaceChildren();
      requestHeight();
      return;
    }
    suggestEl.hidden = false;
    var rows = history.slice(0, SUGGEST_LIMIT);
    suggestList.replaceChildren();
    for (var i = 0; i < rows.length; i++) {
      suggestList.appendChild(buildSuggestionRow(rows[i], i));
    }
    if (selected >= rows.length) selected = -1;
    applySelection();
    requestHeight();
  }

  /**
   * Clicking or Enter-on-selection fills the field; it never sends. The list
   * disappears because the field is no longer empty, which also shrinks the
   * window back.
   */
  function insertFromSuggestion(index) {
    var entry = history[index];
    if (!entry) return;
    selected = -1;
    recallIndex = -1;
    draft = "";
    input.value = entry.text;
    try { input.focus(); } catch (err) { /* window may be going away */ }
    placeCaretAtEnd();
    renderSuggestions();
  }

  /**
   * One step along the walk: negative is older (↑), positive is newer (↓).
   * The draft sits one step below the newest entry and is restored there.
   */
  function recallHistory(step) {
    if (history.length === 0) return false;
    if (step < 0) {
      if (recallIndex < 0) {
        draft = input.value;
        recallIndex = 0;
      } else if (recallIndex < history.length - 1) {
        recallIndex += 1;
      } else {
        return true;
      }
    } else {
      if (recallIndex < 0) return false;
      if (recallIndex > 0) {
        recallIndex -= 1;
      } else {
        recallIndex = -1;
        input.value = draft;
        selected = -1;
        placeCaretAtEnd();
        renderSuggestions();
        return true;
      }
    }
    input.value = history[recallIndex].text;
    selected = -1;
    placeCaretAtEnd();
    renderSuggestions();
    return true;
  }

  function setPending(on) {
    pending = !!on;
    input.disabled = pending;
    progress.hidden = !pending;
    status.textContent = pending ? labels.starting : "";
    if (pending) {
      clearError();
    } else {
      // The field must never feel dead after a refusal: give it back with the
      // text still in place so the user can correct and retry.
      try { input.focus(); } catch (err) { /* window is going away */ }
    }
    // A pending turn owns the target; the choice must not change mid-flight.
    renderTarget();
    // No suggestions while a turn is starting; restoring the field brings
    // them back with it.
    renderSuggestions();
  }

  function submit() {
    if (pending) return;
    // An Enter that commits an IME composition is not a send and not a
    // history/list activation. The browser fires `compositionend` between the
    // keydown and this submit, so the flag read alone is not enough;
    // `imeEnter` remembers the exact keystroke.
    if (composing || imeEnter) {
      imeEnter = false;
      return;
    }
    // Enter on a highlighted suggestion inserts it instead of sending. A
    // second Enter (now with no selection) sends the field.
    if (selected >= 0) {
      insertFromSuggestion(selected);
      return;
    }
    var value = input.value.trim();
    if (!value) {
      showError(labels.empty, "empty");
      input.focus();
      return;
    }
    if (!api) return;
    setPending(true);
    // Defensive: a stale mode can never ask main to continue without a target.
    var mode = target.canContinue && target.mode === "continue" ? "continue" : "new";
    api.submit(value, mode);
  }

  function show(payload) {
    var data = payload || {};
    if (data.labels) {
      for (var key in data.labels) {
        if (Object.prototype.hasOwnProperty.call(data.labels, key)) {
          labels[key] = data.labels[key];
        }
      }
    }
    document.documentElement.lang = data.lang || "en";
    document.body.dataset.theme = data.theme === "clawd" ? "clawd" : "sao";
    applyLabels();

    // History arrives newest first. Only records that can be displayed are
    // kept; the same text twice in one list would be a duplicate row.
    history = [];
    if (Array.isArray(data.history)) {
      for (var h = 0; h < data.history.length && history.length < 40; h++) {
        var item = data.history[h];
        if (!item || typeof item.text !== "string" || !item.text) continue;
        history.push({
          text: item.text,
          at: typeof item.at === "number" ? item.at : 0
        });
      }
    }
    selected = -1;
    recallIndex = -1;
    draft = "";
    lastExtra = -1;
    ageFormat = null;

    // Every open starts on main's default (CONTINUE only when it can name a
    // live, still-existing thread). The choice is per ask, never sticky.
    var incoming = data.target || {};
    target = {
      canContinue: incoming.canContinue === true,
      mode: incoming.mode === "continue" && incoming.canContinue === true ? "continue" : "new",
      label: typeof incoming.label === "string" ? incoming.label : ""
    };

    pending = false;
    composing = false;
    input.value = "";
    input.disabled = false;
    progress.hidden = true;
    status.textContent = "";
    clearError();
    renderTarget();
    historyHintEl.hidden = history.length === 0 || !labels.historyHint;
    // Run before ready(): the resize request reaches main ahead of the reveal,
    // so the bar is first shown at its final height.
    renderSuggestions();
    // A busy user-facing turn is a precondition, not a failed attempt: say so
    // up front, but leave the field usable in case that turn stops meanwhile.
    if (data.busy === true) showError(labels.busy, "busy");

    panel.classList.add("visible");
    window.setTimeout(function () {
      ready = true;
      if (api) api.ready();
      try { input.focus(); } catch (err) { /* not focusable yet */ }
    }, 0);
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    submit();
  });

  // One click flips the decision. Activating the chip with Enter is a button
  // click, not a form submit, so the field's IME guard is untouched. An error
  // that described the previous choice is cleared; "busy"/"empty" are
  // preconditions and stay.
  targetEl.addEventListener("click", function (event) {
    event.preventDefault();
    if (pending || !target.canContinue) return;
    target.mode = target.mode === "continue" ? "new" : "continue";
    if (errorEl.dataset.kind === "error") clearError();
    renderTarget();
    try { input.focus(); } catch (err) { /* window may be going away */ }
  });

  input.addEventListener("compositionstart", function () {
    composing = true;
  });
  input.addEventListener("compositionend", function () {
    composing = false;
  });
  input.addEventListener("input", function () {
    // Any text hides the list; clearing the field brings it back.
    selected = -1;
    renderSuggestions();
  });
  input.addEventListener("keydown", function (event) {
    // An IME owns the keys it is consuming: arrows walk candidates and Enter
    // commits the composition. None of that may navigate history or send.
    // 229 is the legacy keyCode Chromium reports while an IME owns the key.
    if (composing || event.isComposing || event.keyCode === 229) {
      if (event.key === "Enter") {
        imeEnter = true;
        window.setTimeout(function () { imeEnter = false; }, 0);
      }
      return;
    }
    if (event.key === "ArrowUp") {
      // Move within a selected list first; with no selection, ↑ starts (or
      // continues) the walk through history and fills the field.
      if (selected >= 0) {
        event.preventDefault();
        selected = selected > 0 ? selected - 1 : -1;
        applySelection();
        return;
      }
      if (recallHistory(-1)) event.preventDefault();
      return;
    }
    if (event.key === "ArrowDown") {
      if (recallIndex >= 0) {
        if (recallHistory(1)) event.preventDefault();
        return;
      }
      // Empty field + list: ↓ enters the list without touching the field.
      if (suggestVisible()) {
        event.preventDefault();
        if (selected < suggestList.children.length - 1) {
          selected += 1;
          applySelection();
        }
      }
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      // While composing, Escape means "cancel the IME composition", not
      // "dismiss the bar".
      if (event.isComposing) return;
      event.preventDefault();
      if (api) api.close();
    }
  });

  // Clicking inside the panel must not count as click-away; that is handled by
  // the window's blur in the main process.

  if (api) {
    api.onShow(show);
    api.onPending(function (data) {
      setPending(true);
      if (data && data.label) status.textContent = data.label;
    });
    api.onError(function (data) {
      setPending(false);
      showError(data && data.message, data && data.kind);
    });
    api.onFocus(function () {
      if (!pending) {
        try { input.focus(); } catch (err) { /* not focusable */ }
      }
    });
  } else {
    // Loaded outside Electron (screenshot harness): show the finished surface.
    show({ lang: "en", theme: "sao", labels: labels, busy: false });
  }
})();
</script>
</body>
</html>
