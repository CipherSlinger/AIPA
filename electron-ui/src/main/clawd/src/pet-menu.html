<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* SAO HUD grammar shared with update-bubble.html: near-black translucent
   panels, cut corners, one accent per action, uppercase monospace. The window
   itself is transparent — only the ring, its petals and the centre orb draw.

   Two levels, one surface. MORE opens a second ring inside this same window;
   the levels cross-fade rather than swapping, so the menu reads as one
   instrument opening a notch, not two menus in sequence. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: "Cascadia Code", "SF Mono", ui-monospace, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body { position: relative; }

:root {
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.46, 0.64, 1);
  --hud-text: #dff7f3;
  --hud-muted: #7fa8a2;
  --hud-accent: #3fe0c8;
  --accent: #3fe0c8;
}

.ring {
  position: absolute;
  inset: 0;
  outline: none;
  opacity: 1;
  transform: scale(1);
  transition: opacity 120ms linear, transform 140ms var(--ease-out);
}
.ring.closing { opacity: 0; transform: scale(0.965); }
.ring:focus { outline: none; }

/* ── Levels ──────────────────────────────────────────────────────────────── */
/* Each level owns its track and its petals. The inactive one stays in the DOM
   (fading out still needs to be painted) but is inert, so Tab and the
   accessibility tree never land on a petal that is not on screen. */
.layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(0.93);
  pointer-events: none;
  transition: opacity 110ms linear, transform 110ms var(--ease-out);
}
.layer.is-active {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}
/* The nested ring — and the session ring behind RECENT — arrives a beat slower
   and with a little overshoot: it is the answer to a press, not the first thing
   the user sees. */
.layer--nested,
.layer--sessions { transition: opacity 140ms linear, transform 140ms var(--ease-spring); }

/* ── Track ───────────────────────────────────────────────────────────────── */
.track {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 202px;
  height: 202px;
  margin: -101px 0 0 -101px;
  border-radius: 50%;
  border: 1px dashed rgba(63, 224, 200, 0.16);
  pointer-events: none;
}
.track::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 74%, rgba(63, 224, 200, 0.5) 86%, transparent 100%);
  -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%);
  mask: radial-gradient(circle, transparent 64%, #000 66%);
  animation: sweep 5.5s linear infinite;
}
/* The inner track borrows the colour of the petal that opened it (MORE is
   violet), so the second ring visibly belongs to the first. */
.track--nested {
  width: 144px;
  height: 144px;
  margin: -72px 0 0 -72px;
  border-color: rgba(185, 140, 255, 0.16);
}
.track--nested::after {
  background: conic-gradient(from 0deg, transparent 0 74%, rgba(185, 140, 255, 0.5) 86%, transparent 100%);
}

/* ── Petals ──────────────────────────────────────────────────────────────── */
.petals { position: absolute; inset: 0; }
.petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 128px;
  height: 46px;
  margin: -23px 0 0 -64px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--hud-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  outline: none;
  transform: translate(var(--x), var(--y));
  animation: petalIn 280ms var(--ease-out) both;
  animation-delay: calc(var(--i) * 45ms);
  transition: filter 160ms ease;
}
.petal:hover,
.petal:focus-visible { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 50%, transparent)); }

/* Cut corners live on the children, not on the button: the button carries the
   hover glow as a filter, and a parent clip-path would crop that glow away. */
.petal .edge {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--accent) 38%, rgba(4, 11, 13, 0.55));
  clip-path: polygon(
    0 0,
    calc(100% - 13px) 0,
    100% 13px,
    100% 100%,
    13px 100%,
    0 calc(100% - 13px)
  );
  transition: background 160ms ease;
}
.petal .face {
  position: absolute;
  inset: 1px;
  clip-path: polygon(
    0 0,
    calc(100% - 12px) 0,
    100% 12px,
    100% 100%,
    12px 100%,
    0 calc(100% - 12px)
  );
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 11px;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent 58%),
    linear-gradient(180deg, rgba(9, 23, 26, 0.97), rgba(4, 11, 13, 0.98));
  transition: background 160ms ease;
}
.petal .face::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.35;
}
.petal:hover .edge,
.petal:focus-visible .edge { background: var(--accent); }
.petal:hover .face,
.petal:focus-visible .face {
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 24%, transparent), transparent 68%),
    linear-gradient(180deg, rgba(11, 28, 32, 0.98), rgba(5, 14, 17, 0.99));
}

.petal .glyph {
  flex: none;
  width: 18px;
  height: 18px;
  color: var(--accent);
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent));
}
.petal .glyph svg { display: block; width: 100%; height: 100%; }
.petal .text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.petal .label {
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--hud-text);
  text-shadow: 0 0 10px rgba(223, 247, 243, 0.14);
}
.petal .key {
  position: absolute;
  top: 3px;
  right: 7px;
  font-size: 7px;
  line-height: 1;
  letter-spacing: 0.12em;
  color: var(--hud-muted);
  opacity: 0.65;
}

/* The silenced SILENCE petal carries a number on top of its label ("Resume ·
   28m"). At 10.5px with 0.15em tracking that runs past the 77px of text a
   128px chip leaves, and the label is set nowrap — so it steps down one size
   while counting. */
.petal.is-counting .label {
  font-size: 9px;
  letter-spacing: 0.08em;
}

/* Countdown rail on the silenced SILENCE petal: it starts full when the ring
   opens and empties exactly when the silence lifts. Sized once at build time
   as an animation duration — the menu only lives for seconds, so a per-frame
   JS loop would spend a renderer tick to redraw the same two pixels. */
.petal .arc {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left center;
  opacity: 0;
  pointer-events: none;
}
.petal .arc.is-running {
  opacity: 0.9;
  animation: arcDrain var(--arc-ms, 1000ms) linear forwards;
}

/* Unread count on MORE (outer) and NOTICES (nested): the outer pill is what
   tells the user there is something behind the second level at all. */
.petal .pill {
  position: absolute;
  top: -7px;
  right: -7px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: #ff5d5d;
  box-shadow: 0 0 10px rgba(255, 93, 93, 0.45);
  color: #170809;
  font-size: 8px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.04em;
  pointer-events: none;
}
.petal .pill[hidden] { display: none; }

/* A petal whose callback is missing is not rendered at all; a petal that is
   only disabled (STOP with no turn) keeps its place on the ring, dimmed. */
.petal[aria-disabled="true"] { cursor: not-allowed; filter: none; }
.petal[aria-disabled="true"] .edge { background: rgba(127, 168, 162, 0.22); }
.petal[aria-disabled="true"] .face {
  background: linear-gradient(180deg, rgba(9, 19, 21, 0.95), rgba(5, 12, 14, 0.96));
}
.petal[aria-disabled="true"] .glyph { color: var(--hud-muted); opacity: 0.6; }
.petal[aria-disabled="true"] .label { color: var(--hud-muted); opacity: 0.75; }
.petal[aria-disabled="true"] .key { opacity: 0.4; }
.petal[aria-disabled="true"]:hover,
.petal[aria-disabled="true"]:focus-visible { filter: none; }

/* ── Nested petals ───────────────────────────────────────────────────────── */
/* One size down and pulled in to a 108px radius: the window is not resized
   for the second level, so the whole nested ring has to fit the same square
   as the outer one (it does — 165px of reach against a 210px half-window). */
.petal--nested {
  width: 124px;
  height: 40px;
  margin: -20px 0 0 -62px;
}
.petal--nested .edge {
  clip-path: polygon(
    0 0,
    calc(100% - 10px) 0,
    100% 10px,
    100% 100%,
    10px 100%,
    0 calc(100% - 10px)
  );
}
.petal--nested .face {
  clip-path: polygon(
    0 0,
    calc(100% - 9px) 0,
    100% 9px,
    100% 100%,
    9px 100%,
    0 calc(100% - 9px)
  );
  gap: 6px;
  padding: 0 9px;
}
.petal--nested .glyph { width: 14px; height: 14px; }
/* "ALL COMMANDS" is the longest label and has to fit 84px of chip; 0.1em is
   the widest tracking that does on a fallback font as well as Cascadia. */
.petal--nested .label { font-size: 9.5px; letter-spacing: 0.1em; }
.petal--nested .key { top: 2px; right: 6px; font-size: 6.5px; }

/* ── Session petals (third ring) ─────────────────────────────────────────── */
/* Same 124x40 chip and the same clearance as the nested ring: a conversation
   title is longer than an action label, and letting the chip grow to fit it
   would push the outer edge past the window. The label truncates instead; the
   age stays a fixed-width muted suffix so the text column is predictable. */
.petal--session .face {
  gap: 6px;
  padding: 0 9px;
}
.petal--session .label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  /* The inherited 0.15em tracking is sized for two-word actions and spends
     width a conversation title does not have; the chip ellipsizes the rest. */
  letter-spacing: 0.04em;
  font-size: 9.5px;
}
.petal--session .when {
  flex: none;
  font-size: 7.5px;
  line-height: 1;
  letter-spacing: 0.08em;
  color: var(--hud-muted);
  opacity: 0.85;
}
.petal--session .key { top: 2px; right: 6px; font-size: 6.5px; }
/* The empty state is one disabled chip, not a blank ring: it keeps its place so
   the level still reads as a ring and the way back is where the user left it. */
.petal--empty .label { font-size: 8.5px; letter-spacing: 0.06em; }
.petal--empty .when { display: none; }
.petal[aria-disabled="true"] .when { opacity: 0.45; }

/* ── Centre orb ──────────────────────────────────────────────────────────── */
.orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 78px;
  height: 78px;
  margin: -39px 0 0 -39px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--hud-accent) 55%, transparent);
  background: radial-gradient(circle at 50% 34%, rgba(63, 224, 200, 0.20), rgba(4, 11, 13, 0.97) 66%);
  color: var(--hud-text);
  font: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  outline: none;
  box-shadow: 0 0 24px rgba(63, 224, 200, 0.12), inset 0 0 20px rgba(63, 224, 200, 0.10);
  animation: orbIn 300ms var(--ease-out) both;
  animation-delay: 40ms;
  transition: box-shadow 180ms ease, border-color 180ms ease;
}
.orb:hover,
.orb:focus-visible {
  border-color: var(--hud-accent);
  box-shadow: 0 0 34px rgba(63, 224, 200, 0.30), inset 0 0 24px rgba(63, 224, 200, 0.20);
}
.orb-ring {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  border: 1px solid rgba(63, 224, 200, 0.15);
  border-top-color: rgba(63, 224, 200, 0.65);
  animation: orbit 4.5s linear infinite;
  pointer-events: none;
}
.orb-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-indent: 0.22em;
}
.orb-hint {
  font-size: 7.5px;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  color: var(--hud-muted);
}

/* Back affordance: on the second level the orb stops being "close" and
   becomes "one level up", so it takes the violet of the petal that opened it. */
.orb.is-back {
  border-color: rgba(185, 140, 255, 0.6);
  background: radial-gradient(circle at 50% 34%, rgba(185, 140, 255, 0.20), rgba(4, 11, 13, 0.97) 66%);
  box-shadow: 0 0 24px rgba(185, 140, 255, 0.14), inset 0 0 20px rgba(185, 140, 255, 0.10);
}
.orb.is-back:hover,
.orb.is-back:focus-visible {
  border-color: #b98cff;
  box-shadow: 0 0 34px rgba(185, 140, 255, 0.32), inset 0 0 24px rgba(185, 140, 255, 0.20);
}
.orb.is-back .orb-ring {
  border-color: rgba(185, 140, 255, 0.15);
  border-top-color: rgba(185, 140, 255, 0.75);
}
.orb.is-back .orb-label {
  font-size: 19px;
  line-height: 1;
  letter-spacing: 0;
  text-indent: 0;
}

.hint {
  position: absolute;
  left: 50%;
  /* Just under the ring, not at the window edge: the window is larger than the
     ring so the petals can glow, and a hint parked at the bottom read as
     belonging to nothing. */
  top: calc(50% + 152px);
  transform: translateX(-50%);
  font-size: 8px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(127, 168, 162, 0.75);
  white-space: nowrap;
  animation: hintIn 420ms var(--ease-out) both;
  animation-delay: 180ms;
  pointer-events: none;
}

/* ── Telemetry ───────────────────────────────────────────────────────────── */
/* Two gauges parked on the hint line's baseline, in the lower corners. The
   lowest outer petal ends at y≈346 in a 420px window and these start at 360,
   so no petal angle can ever sit on top of a reading. The box is fixed and a
   failed reading only flips `visibility` (never `display`), so the corners
   never move when the data comes and goes. */
.telemetry {
  --bar-color: var(--hud-accent);
  position: absolute;
  top: calc(50% + 150px);
  width: 84px;
  height: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.14em;
  pointer-events: none;
  animation: hintIn 420ms var(--ease-out) both;
  animation-delay: 220ms;
}
.telemetry--cpu { left: 12px; }
.telemetry--mem { right: 12px; --bar-color: #58a6ff; }
.telemetry[data-empty="true"] { visibility: hidden; }
.telemetry .gauge-label {
  flex: none;
  color: rgba(127, 168, 162, 0.78);
  text-transform: uppercase;
}
.telemetry .gauge-track {
  position: relative;
  flex: 1 1 auto;
  height: 3px;
  background: color-mix(in srgb, var(--bar-color) 16%, transparent);
  clip-path: polygon(
    0 0,
    calc(100% - 3px) 0,
    100% 3px,
    100% 100%,
    0 100%
  );
}
.telemetry .gauge-fill {
  position: absolute;
  inset: 0;
  background: var(--bar-color);
  transform: scaleX(var(--bar-fill, 0));
  transform-origin: left center;
  transition: transform 520ms var(--ease-out);
}
.telemetry .gauge-value {
  flex: none;
  min-width: 22px;
  text-align: right;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--bar-color);
}

/* ── Running indicator ───────────────────────────────────────────────────── */
/* One small line just above the orb. The enabled STOP petal already says a
   turn is running; this is a glance-level confirmation, so it stays quieter
   than the ring and never draws a petal's accent. */
.running {
  position: absolute;
  left: 50%;
  /* Below the orb rather than above it: that half of the ring is empty, while
     the line above the orb runs straight into the MORE and OPEN AIPA petals
     as soon as it carries a conversation name. */
  top: calc(50% + 72px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  /* A button, not a div: the dot is a status line until a conversation name
     is known, at which point it becomes the click-through to that turn. The
     button reset keeps both states looking like the same HUD line. */
  appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.22em;
  color: rgba(223, 247, 243, 0.66);
  pointer-events: none;
  animation: hintIn 300ms var(--ease-out) both;
  animation-delay: 120ms;
}
/* The author display rule above would otherwise beat the UA [hidden] rule. */
.running[hidden] { display: none; }

/* A named running conversation: same line, but now an offer. It stays quieter
   than the ring — this is a shortcut, not a fifth petal. */
.running.is-session {
  pointer-events: auto;
  cursor: pointer;
  /* It sits inside the ring, below the orb, where the circle's chord is ~150 px
     wide; a wider chip would reach out and overlap the SILENCE and STOP
     petals. */
  max-width: 168px;
  padding: 3px 7px 3px 6px;
  border: 1px solid rgba(63, 224, 200, 0.22);
  border-radius: 4px;
  /* The ring's own glow runs underneath this line, and a 5% tint let it shine
     straight through the name. The chip is a dark cut-out of the ring instead:
     legible over the arc without becoming a fourth petal. */
  background: rgba(4, 18, 20, 0.82);
  backdrop-filter: blur(3px);
  z-index: 3;
  transition: border-color 140ms linear, background 140ms linear;
}
.running.is-session:hover,
.running.is-session:focus-visible {
  border-color: rgba(63, 224, 200, 0.55);
  background: rgba(10, 34, 36, 0.92);
  outline: none;
}
.running-label {
  min-width: 0;
  max-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* A conversation name is prose, not HUD lettering: the wide tracking that
     suits "RUNNING" turns a clipped prompt into a ribbon. */
  letter-spacing: 0.04em;
  color: rgba(223, 247, 243, 0.9);
}
.running-label[hidden] { display: none; }
.running-label::before {
  content: "·";
  margin: 0 4px 0 2px;
  color: rgba(223, 247, 243, 0.45);
}
.running .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--hud-accent);
  box-shadow: 0 0 8px rgba(63, 224, 200, 0.7);
  animation: runningPulse 1.8s ease-in-out infinite;
}
@keyframes runningPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.35; transform: scale(0.72); }
}

@keyframes petalIn {
  from { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.80); }
  to   { opacity: 1; transform: translate(var(--x), var(--y)) scale(1); }
}
@keyframes orbIn {
  from { opacity: 0; transform: scale(0.82); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes hintIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes arcDrain {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0); }
}

@media (prefers-reduced-motion: reduce) {
  /* No scale anywhere: levels appear and disappear by opacity alone. */
  .petal,
  .orb,
  .hint,
  .telemetry,
  .running { animation: none; }
  .track::after,
  .orb-ring { animation: none; }
  /* A gauge that eases between readings is motion; a gauge that steps is not. */
  .telemetry .gauge-fill { transition: none; }
  /* The dot still reads as "live": it keeps its glow, just without the pulse. */
  .running .dot { animation: none; }
  /* The chip's hover/focus tint is a state change, not decoration; it may
     stay, but easing it is motion. */
  .running.is-session { transition: none; }
  .ring,
  .ring.closing { transition: opacity 80ms linear; transform: none; }
  .layer { transition: opacity 60ms linear; transform: none; }
  .petal,
  .petal .edge,
  .petal .face,
  .orb { transition: none; }
  /* The countdown rail is information, not decoration: with motion off it
     stays a static line under the label instead of draining. */
  .petal .arc.is-running { animation: none; transform: scaleX(1); opacity: 0.55; }
}
</style>
</head>
<body>
<div class="ring" id="ring" tabindex="-1" role="menu" aria-label="AIPA quick menu">
  <div class="layer layer--outer is-active" id="outerLayer">
    <div class="track" aria-hidden="true"></div>
    <div class="petals" id="petals"></div>
  </div>
  <div class="layer layer--nested" id="nestedLayer" aria-hidden="true">
    <div class="track track--nested" aria-hidden="true"></div>
    <div class="petals" id="nestedPetals"></div>
  </div>
  <div class="layer layer--sessions" id="sessionsLayer" aria-hidden="true">
    <!-- The third ring borrows the nested track: same radius, same violet
         family. Only one layer is visible at a time, so reusing it is exact. -->
    <div class="track track--nested track--sessions" aria-hidden="true"></div>
    <div class="petals" id="sessionPetals"></div>
  </div>
  <button class="orb" id="orb" type="button" aria-label="Close">
    <span class="orb-ring" aria-hidden="true"></span>
    <span class="orb-label" id="orbLabel">AIPA</span>
    <span class="orb-hint" id="orbHint">ESC</span>
  </button>
  <button class="running" id="running" type="button" aria-hidden="true" tabindex="-1" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span id="runningText">RUNNING</span>
    <span class="running-label" id="runningLabel" hidden></span>
  </button>
  <div class="telemetry telemetry--cpu" id="telemetryCpu" data-empty="true" aria-hidden="true">
    <span class="gauge-label">CPU</span>
    <span class="gauge-track"><span class="gauge-fill"></span></span>
    <span class="gauge-value" id="cpuValue">--</span>
  </div>
  <div class="telemetry telemetry--mem" id="telemetryMem" data-empty="true" aria-hidden="true">
    <span class="gauge-label">MEM</span>
    <span class="gauge-track"><span class="gauge-fill"></span></span>
    <span class="gauge-value" id="memValue">--</span>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script>
(function () {
  "use strict";

  var api = window.petMenuAPI || null;
  var ring = document.getElementById("ring");
  var outerLayer = document.getElementById("outerLayer");
  var nestedLayer = document.getElementById("nestedLayer");
  var sessionsLayer = document.getElementById("sessionsLayer");
  var layer = document.getElementById("petals");
  var nestedLayerPetals = document.getElementById("nestedPetals");
  var sessionPetalsLayer = document.getElementById("sessionPetals");
  var orb = document.getElementById("orb");
  var orbLabel = document.getElementById("orbLabel");
  var orbHint = document.getElementById("orbHint");
  var hint = document.getElementById("hint");
  var running = document.getElementById("running");
  var runningText = document.getElementById("runningText");
  var runningLabel = document.getElementById("runningLabel");
  var telemetryCpu = document.getElementById("telemetryCpu");
  var telemetryMem = document.getElementById("telemetryMem");
  var cpuValue = document.getElementById("cpuValue");
  var memValue = document.getElementById("memValue");

  var RADIUS = 140;
  // Second ring: a chip's centre cannot sit on a circle, or a wide chip tucks
  // its inner corner under the orb. Its inner edge does, and the centre
  // distance follows from the angle.
  var NESTED_CLEARANCE = 66;
  var CHIP_HALF_W = 64;
  var CHIP_HALF_H = 23;
  // Every nested chip is the same 128x46 as an outer one, so the ring's reach
  // stays inside the unchanged 420px window (~200px from centre at worst).
  // The session ring uses the same chip size and the same rule.
  var SESSION_START_ANGLE = 126; // RECENT's own angle (see NESTED_PETALS)
  var SESSION_STEP = 72;
  var SESSION_LIMIT = 5;
  var SESSION_ACCENT = "#b98cff";

  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // HUD chrome the factory does not translate. The running indicator is drawn
  // here, so its word lives here too — keyed off the same `lang` the rings use,
  // which means no extra payload key and no i18n import.
  var INLINE_LABELS = {
    en: { running: "RUNNING", loading: "LOADING…" },
    zh: { running: "运行中", loading: "载入中…" },
    ko: { running: "실행 중", loading: "불러오는 중…" }
  };
  var CPU_ACCENT = "#3fe0c8";
  var MEM_ACCENT = "#58a6ff";
  var HOT_ACCENT = "#f0b429";
  var HOT_PERCENT = 85;

  function inlineLabel(key, fallback) {
    var dict = INLINE_LABELS[document.documentElement.lang] || INLINE_LABELS.en;
    return dict[key] || fallback || key;
  }

  // Stroke-only glyphs: the accent colour is the only fill, so one icon set
  // reads at 18px on every petal accent.
  var GLYPH = {
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4.2H4v11.6h4.6L12 20l3.4-4.2H20z"/><path d="M12 7.4v5M9.5 9.9h5"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 4.6H4.2v12.6h12.6v-3.4"/><path d="M11.4 12.6 20.2 3.8M14.8 3.8h5.4v5.4"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="1.2"/><path d="M9.4 12h5.2"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4a5.6 5.6 0 0 1 5.6 5.6v4.2l1.5 2.8H5L6.4 13.2V9A5.6 5.6 0 0 1 12 3.4z"/><path d="M9.8 18.6a2.3 2.3 0 0 0 4.4 0"/></svg>',
    bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4a5.6 5.6 0 0 1 5.6 5.6v4.2l1.5 2.8H5L6.4 13.2V9A5.6 5.6 0 0 1 12 3.4z"/><path d="M9.8 18.6a2.3 2.3 0 0 0 4.4 0"/><path d="M3.4 20.6 20.6 3.4"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.4" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>',
    history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 6.8V12l3.6 2.2"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/></svg>',
    hide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 12S6.6 6.6 12 6.6 20.8 12 20.8 12s-3.4 5.4-8.8 5.4S3.2 12 3.2 12z"/><circle cx="12" cy="12" r="2.5"/><path d="M4.4 19.6 19.6 4.4"/></svg>',
  };

  // Fixed order = fixed shortcut numbers, even when a callback is missing and
  // its petal is not rendered. Angles start at the top and step by 72 degrees.
  var PETALS = [
    { action: "new-chat", key: "1", label: "newChat", available: "newChat", accent: "#3fe0c8", glyph: "chat", angle: -90, fallback: "New Chat" },
    { action: "open-aipa", key: "2", label: "openAipa", available: "openAipa", accent: "#58a6ff", glyph: "open", angle: -18, fallback: "Open AIPA" },
    { action: "stop", key: "3", label: "stop", available: "stop", accent: "#ff5d5d", glyph: "stop", angle: 54, fallback: "Stop" },
    { action: "silence", key: "4", label: "silence", available: "silence", accent: "#f0b429", glyph: "bellOff", angle: 126, fallback: "Silence", arc: true },
    { action: "more", key: "5", label: "more", available: null, accent: "#b98cff", glyph: "more", angle: 198, fallback: "More" },
  ];

  // Second ring behind MORE. The first nested petal takes MORE's own angle
  // (198°); five petals now step by 72°, so the petal the user just pressed is
  // still the one under the cursor — the level opens where it was asked to.
  // Existing actions keep their numbers; RECENT takes the new fifth slot.
  var NESTED_PETALS = [
    { action: "notices", key: "1", label: "notices", available: "notices", accent: "#b98cff", glyph: "bell", angle: 198, fallback: "Notices", badge: true },
    { action: "settings", key: "2", label: "settings", available: "settings", accent: "#3fe0c8", glyph: "gear", angle: 270, fallback: "Settings" },
    { action: "hide", key: "3", label: "hidePet", available: "hide", accent: "#58a6ff", glyph: "hide", angle: 342, fallback: "Hide Pet" },
    // The old MORE: the pet's own context menu, still complete.
    { action: "native", key: "4", label: "allCommands", available: "native", accent: "#8b98a5", glyph: "more", angle: 54, fallback: "All Commands" },
    // RECENT is navigation like MORE, so it speaks the level-opener violet and
    // its ring borrows the same colour.
    { action: "recent", key: "5", label: "recent", available: "recent", accent: "#b98cff", glyph: "history", angle: 126, fallback: "Recent" },
  ];

  var labels = {};
  var petals = [];
  var nestedPetals = [];
  var sessionPetals = [];
  // "outer" | "nested" | "sessions". Escape depends on it: each step goes one
  // level back, and only the outer ring closes the menu.
  var view = "outer";
  var ready = false;
  var closing = false;
  // Instant (epoch ms) the current silence lifts, 0 when there is none. The
  // hint line is rebuilt on every level step, so it reads from here rather
  // than from the payload the outer ring was built with.
  var quietUntil = 0;
  // `{ id, label }` of the conversation the running turn belongs to, or null.
  // Captured with the payload: the chip must keep pointing at the conversation
  // the menu showed even if another turn starts while the ring is open.
  var runningSession = null;
  // Whether STOP is live, kept so a late label can repaint the same state.
  var canStopNow = false;
  // The sessions ring is fetched on demand: listing conversations costs a walk
  // of the session store in the main process, and that walk must not sit inside
  // the menu's reveal budget. `sessionsBuilt` says the ring has real chips;
  // `sessionsPending` keeps a second RECENT click from asking twice.
  var sessionsBuilt = false;
  var sessionsPending = false;

  function nestedDistance(angle) {
    var rad = (angle * Math.PI) / 180;
    return NESTED_CLEARANCE +
      Math.abs(Math.cos(rad)) * CHIP_HALF_W +
      Math.abs(Math.sin(rad)) * CHIP_HALF_H;
  }

  function setPosition(el, angle, radius) {
    var rad = (angle * Math.PI) / 180;
    el.style.setProperty("--x", Math.round(Math.cos(rad) * radius) + "px");
    el.style.setProperty("--y", Math.round(Math.sin(rad) * radius) + "px");
  }

  function makePetal(meta, radius, order, nested) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = nested ? "petal petal--nested" : "petal";
    btn.dataset.action = meta.action;
    btn.dataset.key = meta.key;
    btn.setAttribute("role", "menuitem");
    btn.setAttribute("aria-keyshortcuts", meta.key);
    btn.style.setProperty("--i", String(order));
    btn.style.setProperty("--accent", meta.accent);
    setPosition(btn, meta.angle, nested ? nestedDistance(meta.angle) : radius);
    // The countdown rail sits inside the face, not on the button: the face is
    // what carries the cut corners, so it clips the rail to the chip's shape.
    btn.innerHTML =
      '<span class="edge"></span>' +
      '<span class="face">' +
        '<span class="glyph">' + GLYPH[meta.glyph] + '</span>' +
        '<span class="label"></span>' +
        '<span class="key"></span>' +
        (meta.arc ? '<span class="arc" aria-hidden="true"></span>' : '') +
      '</span>' +
      '<span class="pill" aria-hidden="true" hidden></span>';
    btn.querySelector(".label").textContent = labels[meta.label] || meta.fallback || meta.action;
    btn.querySelector(".key").textContent = meta.key;
    btn.addEventListener("click", function (event) {
      event.preventDefault();
      choose(btn);
    });
    return btn;
  }

  // A count is only ever a count: capping the pill keeps the chip readable and
  // says "more than nine" just as clearly as the real number would.
  function setBadge(btn, count) {
    if (!btn) return;
    var pill = btn.querySelector(".pill");
    if (!pill) return;
    if (count > 0) {
      pill.textContent = count > 9 ? "9+" : String(count);
      pill.hidden = false;
    } else {
      pill.hidden = true;
      pill.textContent = "";
    }
  }

  /**
   * A session chip: the nested geometry without a glyph, so the conversation
   * label gets the width, with the age as a muted suffix. The label lives in a
   * flex child that may shrink; `overflow: hidden` + ellipsis in CSS is what
   * keeps a long prompt from widening the chip past the ring.
   */
  function makeSessionPetal(meta, order) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "petal petal--nested petal--session" + (meta.disabled ? " petal--empty" : "");
    btn.dataset.action = meta.action;
    btn.setAttribute("role", "menuitem");
    btn.style.setProperty("--i", String(order));
    btn.style.setProperty("--accent", meta.accent);
    setPosition(btn, meta.angle, nestedDistance(meta.angle));
    if (meta.key) {
      btn.dataset.key = meta.key;
      btn.setAttribute("aria-keyshortcuts", meta.key);
    }
    btn.innerHTML =
      '<span class="edge"></span>' +
      '<span class="face">' +
        '<span class="label"></span>' +
        '<span class="when" aria-hidden="true"></span>' +
        '<span class="key"></span>' +
      '</span>';
    btn.querySelector(".label").textContent = meta.label;
    btn.querySelector(".when").textContent = meta.when || "";
    btn.querySelector(".key").textContent = meta.key || "";
    if (meta.disabled) {
      // The empty state keeps its place on the ring but is not an offer.
      btn.setAttribute("aria-disabled", "true");
    } else {
      // The full payload label is the tooltip: truncation is visual only.
      btn.title = meta.label;
      btn.addEventListener("click", function (event) {
        event.preventDefault();
        choose(btn);
      });
    }
    return btn;
  }

  /**
   * Paint the sessions ring. Newest-first order and the cap are repeated here
   * so a stale or hand-built list can never overflow the ring or repeat a
   * thread. With nothing to show, `noteText` (or the localized empty state)
   * claims one slot: an unexplained empty ring would look broken.
   */
  function renderSessionChips(list, noteText) {
    sessionPetalsLayer.textContent = "";
    sessionPetals = [];
    var sessions = Array.isArray(list) ? list : [];
    var seen = {};
    for (var i = 0; i < sessions.length && sessionPetals.length < SESSION_LIMIT; i++) {
      var session = sessions[i];
      if (!session || typeof session.id !== "string" || !session.id) continue;
      if (seen[session.id]) continue;
      seen[session.id] = true;
      var chip = makeSessionPetal({
        action: "session:" + session.id,
        key: String(sessionPetals.length + 1),
        label: typeof session.label === "string" && session.label ? session.label : session.id,
        when: typeof session.when === "string" ? session.when : "",
        accent: SESSION_ACCENT,
        angle: SESSION_START_ANGLE + sessionPetals.length * SESSION_STEP,
      }, sessionPetals.length);
      sessionPetalsLayer.appendChild(chip);
      sessionPetals.push(chip);
    }
    if (sessionPetals.length) return;
    var note = makeSessionPetal({
      action: "none",
      key: "",
      label: noteText || labels.noRecentChats || "No recent chats",
      when: "",
      accent: noteText ? SESSION_ACCENT : "#8b98a5",
      angle: SESSION_START_ANGLE,
      disabled: true,
    }, 0);
    sessionPetalsLayer.appendChild(note);
    sessionPetals.push(note);
  }

  /**
   * Ask the main process for the session list. It walks the session store, so
   * it happens on the deliberate click into RECENT rather than when the ring
   * opens — a right-click must never wait on the conversation history.
   */
  function requestSessions() {
    sessionsPending = true;
    renderSessionChips([], inlineLabel("loading", "LOADING…"));
    if (api && api.requestSessions) {
      api.requestSessions();
      return;
    }
    // Standalone page: nothing will ever answer, so say "none" rather than
    // leaving a loading chip spinning forever.
    sessionsPending = false;
    sessionsBuilt = true;
    renderSessionChips([]);
  }

  function setLevel(el, active) {
    el.classList.toggle("is-active", active);
    el.setAttribute("aria-hidden", active ? "false" : "true");
    // `inert` is what keeps Tab and assistive tech off the level that is not
    // on screen; pointer-events alone would still let the keyboard reach it.
    try { el.inert = !active; } catch (err) { /* pointer-events still covers the pointer path */ }
  }

  // A silenced pet still closes on Escape; the hint just spends its width on
  // the one fact the user came to the menu for — when the quiet ends.
  function closeHint() {
    if (quietUntil) {
      var until = (labels.silencedUntil || "Silenced until {time}")
        .replace("{time}", formatClock(quietUntil));
      return until + "  ·  ESC";
    }
    return (labels.close || "Close") + "  ·  ESC";
  }

  // 24-hour local time, padded by hand: toLocaleTimeString follows the OS
  // locale and can produce "9:40 PM" inside an otherwise numeric HUD line.
  function formatClock(ms) {
    var date = new Date(ms);
    var hh = date.getHours();
    var mm = date.getMinutes();
    return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }

  // Round up: 61 seconds left is "2m", not "1m". Anything under a minute is
  // "<1m" so the petal never claims a time that has already run out.
  function remainderText(ms) {
    if (!(ms > 0)) return "";
    if (ms < 60000) return "<1m";
    var mins = Math.ceil(ms / 60000);
    if (mins < 60) return mins + "m";
    var hours = Math.floor(mins / 60);
    var rest = mins % 60;
    return rest ? hours + "h " + rest + "m" : hours + "h";
  }

  /**
   * One gauge. `ratio` is 0–1 from the main process, or null/absent when the
   * sample failed or came from a payload older than this renderer. A missing
   * reading hides the bar by visibility so its fixed box stays put.
   */
  function paintTelemetryBar(bar, valueEl, ratio, accent) {
    if (typeof ratio !== "number" || !isFinite(ratio)) {
      bar.setAttribute("data-empty", "true");
      return;
    }
    var clamped = Math.max(0, Math.min(1, ratio));
    var pct = Math.round(clamped * 100);
    bar.setAttribute("data-empty", "false");
    bar.style.setProperty("--bar-color", pct > HOT_PERCENT ? HOT_ACCENT : accent);
    bar.style.setProperty("--bar-fill", String(clamped));
    valueEl.textContent = pct + "%";
  }

  /** `{ cpu, mem }` as fractions, either key possibly null. Entirely optional. */
  function paintTelemetry(telemetry) {
    var data = telemetry && typeof telemetry === "object" ? telemetry : {};
    paintTelemetryBar(telemetryCpu, cpuValue, data.cpu, CPU_ACCENT);
    paintTelemetryBar(telemetryMem, memValue, data.mem, MEM_ACCENT);
  }

  /**
   * SILENCE while silenced: green accent, the resume label plus the time left,
   * and a rail that empties as the deadline approaches. With no deadline in the
   * payload (an older main process) it stays exactly the pre-countdown petal.
   */
  function paintSilence(btn, quiet, left) {
    var remainder = left > 0 ? remainderText(left) : "";
    var counting = quiet && remainder !== "";
    btn.querySelector(".label").textContent = counting
      ? (labels.resume || "RESUME") + " · " + remainder
      : (quiet ? (labels.resume || "RESUME") : (labels.silence || "SILENCE"));
    btn.classList.toggle("is-counting", counting);
    btn.style.setProperty("--accent", quiet ? "#57d98a" : "#f0b429");

    var arc = btn.querySelector(".arc");
    if (!arc) return;
    arc.classList.remove("is-running");
    if (!counting) {
      arc.style.removeProperty("--arc-ms");
      return;
    }
    // Duration, not width: the rail is full at build time and reaches zero at
    // `quietUntil`. One animation does the whole countdown.
    arc.style.setProperty("--arc-ms", Math.max(1, Math.round(left)) + "ms");
    arc.classList.add("is-running");
  }

  function backHint() {
    return (labels.back || "Back") + "  ·  ESC";
  }

  function setOrbBack(back) {
    orb.classList.toggle("is-back", back);
    orbLabel.textContent = back ? "←" : "AIPA";
    orbHint.textContent = "ESC";
    orb.setAttribute("aria-label", back ? (labels.back || "Back") : (labels.close || "Close"));
  }

  function build(payload) {
    var data = payload || {};
    labels = data.labels || {};
    var state = data.state || {};
    // `available` lives at the top level; the older spot under `state` is still
    // honoured so a payload from a half-updated factory cannot hide the ring.
    var available = data.available || state.available || {};
    var badges = data.badges || {};
    var unread = typeof badges.notices === "number" && badges.notices > 0
      ? Math.floor(badges.notices)
      : 0;
    document.documentElement.lang = data.lang || "en";
    runningText.textContent = inlineLabel("running", "RUNNING");

    layer.textContent = "";
    nestedLayerPetals.textContent = "";
    sessionPetalsLayer.textContent = "";
    petals = [];
    nestedPetals = [];
    sessionPetals = [];

    var order = 0;
    for (var i = 0; i < PETALS.length; i++) {
      var meta = PETALS[i];
      // A petal whose AIPA callback does not exist is omitted instead of
      // throwing on click or offering an action that cannot run.
      if (meta.available && available[meta.available] === false) continue;
      var btn = makePetal(meta, RADIUS, order++, false);
      if (meta.action === "more") setBadge(btn, unread);
      layer.appendChild(btn);
      petals.push(btn);
    }

    for (var j = 0; j < NESTED_PETALS.length; j++) {
      var nested = NESTED_PETALS[j];
      if (nested.available && available[nested.available] === false) continue;
      var nbtn = makePetal(nested, 0, j, true);
      if (nested.badge) setBadge(nbtn, unread);
      nestedLayerPetals.appendChild(nbtn);
      nestedPetals.push(nbtn);
    }

    // Third ring. The live menu fetches the list when RECENT is chosen (see
    // `requestSessions`), so the payload normally carries none; the standalone
    // page still embeds a sample, which is painted here.
    sessionsBuilt = false;
    sessionsPending = false;
    var bootSessions = Array.isArray(data.sessions) ? data.sessions : [];
    if (bootSessions.length) {
      renderSessionChips(bootSessions);
      sessionsBuilt = true;
    }

    applyState(state);
    // The RUNNING chip knows which conversation but not yet its name: naming it
    // walks the session store, which this reveal must not wait on. Ask for the
    // same listing the RECENT ring uses; the name fills in when it lands.
    if (runningSession && runningSession.id && !runningSession.label && !sessionsBuilt && !sessionsPending) {
      requestSessions();
    }
    // Absent on an older factory: both bars read as "no telemetry" and hide.
    paintTelemetry(data.telemetry);

    view = "outer";
    setLevel(outerLayer, true);
    setLevel(nestedLayer, false);
    setLevel(sessionsLayer, false);
    setOrbBack(false);
    hint.textContent = closeHint();

    // The menu is revealed only after this tick, so the first thing the user
    // sees is the finished ring, never an empty transparent window. A timer
    // rather than requestAnimationFrame: the window is still hidden here and a
    // hidden page may not run animation frames at all.
    window.setTimeout(function () {
      ready = true;
      if (api) api.ready();
      focusRing();
    }, 0);
  }

  /**
   * The line above the orb. It says "a turn is running" only while STOP is
   * live — otherwise it would claim work the user cannot stop. When the main
   * process also named the conversation, the line becomes a chip that opens
   * it. With no name (an older payload, a session id not known yet) it stays
   * the decorative status text it always was: no tab stop, no pointer target.
   */
  function paintRunning(canStop) {
    running.hidden = !canStop;
    var session = canStop ? runningSession : null;
    var clickable = !!(session && session.id);
    running.classList.toggle("is-session", clickable);
    // The action carries the id; the factory opens exactly this conversation.
    running.dataset.action = clickable ? "running-session:" + session.id : "";
    // A focusable button behind aria-hidden is an accessibility trap. The
    // status-only state is therefore removed from the tab order as well.
    running.tabIndex = clickable ? 0 : -1;
    running.setAttribute("aria-hidden", clickable ? "false" : "true");
    runningText.textContent = inlineLabel("running", "RUNNING");
    if (!clickable) {
      runningLabel.hidden = true;
      runningLabel.textContent = "";
      running.removeAttribute("title");
      running.removeAttribute("aria-label");
      return;
    }
    if (session.label) {
      runningLabel.textContent = session.label;
      runningLabel.hidden = false;
      // The full name is the tooltip: the CSS ellipsis is visual only, the same
      // rule the session chips follow.
      running.title = (labels.runningIn || "Running in this conversation") + " · " + session.label;
    } else {
      // The conversation is known, its name is still on its way (see
      // `adoptRunningLabel`). The chip is already the click-through; only the
      // word after it waits.
      runningLabel.hidden = true;
      runningLabel.textContent = "";
      running.title = labels.runningIn || "Running in this conversation";
    }
    running.setAttribute("aria-label", running.title);
  }

  /**
   * Fill the RUNNING chip's name from the listing the RECENT ring asks for.
   * Naming a conversation costs a walk of the session store, so the payload
   * carries the id alone and this fills in the rest once the list lands. Only
   * the label is taken: the id was fixed when the menu opened, so a turn that
   * ended meanwhile cannot redirect the chip to a different conversation.
   */
  function adoptRunningLabel(list) {
    if (!runningSession || runningSession.label || !runningSession.id) return;
    if (!Array.isArray(list)) return;
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (item && item.id === runningSession.id && typeof item.label === "string" && item.label) {
        runningSession.label = item.label;
        paintRunning(canStopNow);
        return;
      }
    }
  }

  function applyState(state) {
    var data = state || {};
    var quiet = !!data.quiet;
    var canStop = !!data.canStop;
    canStopNow = canStop;
    // A payload from an older factory has no `quietUntil` at all. Anything that
    // is not a usable instant reads as "unknown", so the petal falls back to
    // exactly what it rendered before the countdown existed.
    var until = typeof data.quietUntil === "number" && isFinite(data.quietUntil) && data.quietUntil > 0
      ? data.quietUntil
      : 0;
    var left = 0;
    if (quiet && until) {
      var now = Date.now();
      left = until > now ? until - now : 0;
    }
    quietUntil = left > 0 ? until : 0;
    // The conversation name arrives with the state. Sanitized here too: the
    // payload is another process's data and the chip writes it into the DOM.
    var named = data.runningSession;
    runningSession = named && typeof named === "object"
      && typeof named.id === "string" && named.id
      ? {
          id: named.id,
          label: typeof named.label === "string" ? named.label : "",
        }
      : null;
    // The dot says "a turn is running" only while STOP is live; otherwise it
    // would claim work the user cannot stop.
    paintRunning(canStop);
    for (var i = 0; i < petals.length; i++) {
      var btn = petals[i];
      if (btn.dataset.action === "stop") {
        btn.setAttribute("aria-disabled", canStop ? "false" : "true");
        btn.title = canStop ? "" : (labels.nothingRunning || "");
      }
      if (btn.dataset.action === "silence") {
        paintSilence(btn, quiet, left);
      }
    }
  }

  function focusRing() {
    try { ring.focus({ preventScroll: true }); } catch (err) { ring.focus(); }
  }

  function focusFirst(list) {
    var usable = enabledPetals(list);
    if (usable.length) { usable[0].focus(); return; }
    focusRing();
  }

  /**
   * MORE swaps levels in place instead of leaving the window. The outer ring
   * fades out, the nested one fades in, and the orb turns into the way back.
   */
  function enterNested() {
    if (view !== "outer" || closing) return;
    // A second ring with nothing on it is a dead end. Every nested action can
    // be unwired except `native`; if even that is gone, hand the user the
    // native menu rather than an empty ring.
    if (!enabledPetals(nestedPetals).length) {
      dismiss("native");
      return;
    }
    view = "nested";
    setLevel(nestedLayer, true);
    setOrbBack(true);
    hint.textContent = backHint();
    // Focus moves off the MORE petal before the outer level goes aria-hidden:
    // Chromium drops aria-hidden on an element that still contains focus. It
    // lands on the ring, not on the first petal — the new level should arrive
    // unlit, with the highlight following the user's own arrow keys.
    focusRing();
    setLevel(outerLayer, false);
  }

  /**
   * RECENT swaps in the third ring the same way MORE opened the second. The
   * session chips already share the nested geometry, so this is only a level
   * change: no re-measure, no second window, and the orb stays the way back.
   */
  function enterSessions() {
    if (view !== "nested" || closing) return;
    if (!sessionsBuilt && !sessionsPending) requestSessions();
    view = "sessions";
    setLevel(sessionsLayer, true);
    setOrbBack(true);
    hint.textContent = backHint();
    // Same focus ordering as enterNested(): leave the RECENT petal before the
    // nested level becomes inert, or Chromium refuses the aria-hidden.
    focusRing();
    setLevel(nestedLayer, false);
  }

  function stepBack() {
    if (view !== "nested" || closing) return;
    view = "outer";
    setLevel(outerLayer, true);
    setOrbBack(false);
    hint.textContent = closeHint();
    focusRing();
    setLevel(nestedLayer, false);
    // Defensive: the sessions layer is already inactive on this path, but a
    // later edit must not leave two levels marked active.
    setLevel(sessionsLayer, false);
  }

  function stepBackSessions() {
    if (view !== "sessions" || closing) return;
    view = "nested";
    setLevel(nestedLayer, true);
    setOrbBack(true);
    hint.textContent = backHint();
    focusRing();
    setLevel(sessionsLayer, false);
  }

  function choose(btn) {
    if (closing || !btn) return;
    if (btn.getAttribute("aria-disabled") === "true") return;
    // MORE and RECENT are navigation, not actions: each opens the next ring
    // in place, and only a leaf petal ends the menu.
    if (btn.dataset.action === "more") {
      enterNested();
      return;
    }
    if (btn.dataset.action === "recent") {
      enterSessions();
      return;
    }
    dismiss(btn.dataset.action);
  }

  function dismiss(action) {
    if (closing) return;
    closing = true;
    ring.classList.add("closing");
    // Fade first, then leave. The factory destroys the window on the other
    // side of this message, so the two never fight over the fade.
    var delay = reduceMotion ? 0 : 110;
    window.setTimeout(function () {
      if (!api) { window.close(); return; }
      if (action) api.choose(action);
      else api.close();
    }, delay);
  }

  function enabledPetals(list) {
    return list.filter(function (btn) {
      return btn.getAttribute("aria-disabled") !== "true";
    });
  }

  function activePetals() {
    if (view === "sessions") return sessionPetals;
    return view === "nested" ? nestedPetals : petals;
  }

  /** Escape / 0 / the orb move exactly one level back. */
  function stepBackOne() {
    if (view === "sessions") stepBackSessions();
    else if (view === "nested") stepBack();
  }

  function focusStep(direction) {
    var list = enabledPetals(activePetals());
    if (!list.length) return;
    var index = list.indexOf(document.activeElement);
    index = index < 0 ? 0 : (index + direction + list.length) % list.length;
    list[index].focus();
  }

  document.addEventListener("keydown", function (event) {
    if (!ready) return;
    if (event.key === "Escape") {
      event.preventDefault();
      // A held Escape must not walk the whole level stack on key repeat.
      if (event.repeat) return;
      // Escape means "one level up": sessions → nested → outer, and from the
      // outer ring it closes the menu.
      if (view === "outer") dismiss(null);
      else stepBackOne();
      return;
    }
    if (view !== "outer" && (event.key === "0" || event.key === "Backspace")) {
      event.preventDefault();
      if (event.repeat) return;
      stepBackOne();
      return;
    }
    if (event.key >= "0" && event.key <= "9") {
      // The same repeat rule matters here: holding the digit that opened a
      // level would otherwise pick a chip on the level it just opened.
      if (event.repeat) return;
      var list = activePetals();
      for (var i = 0; i < list.length; i++) {
        if (list[i].dataset.key === event.key) {
          event.preventDefault();
          choose(list[i]);
          return;
        }
      }
      return;
    }
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      event.preventDefault();
      focusStep(1);
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      event.preventDefault();
      focusStep(-1);
    }
  });

  // Click-away inside the window: the ring occupies the whole transparent
  // surface, so anything that is not a petal or the orb means "close". That
  // holds on the nested ring too — only Escape / the orb step back.
  document.addEventListener("pointerdown", function (event) {
    if (event.button !== 0 || !ready) return;
    var target = event.target;
    if (target && target.closest && (target.closest(".petal") || target.closest(".orb") || target.closest(".running"))) return;
    dismiss(null);
  });

  document.addEventListener("contextmenu", function (event) { event.preventDefault(); });

  orb.addEventListener("click", function (event) {
    event.preventDefault();
    if (view === "outer") dismiss(null);
    else stepBackOne();
  });

  // The RUNNING chip is a click-through, not a level: close the menu and let
  // the factory open the conversation it named. `dataset.action` is empty in
  // the status-only state, which the pointer-events rule already makes inert.
  running.addEventListener("click", function (event) {
    event.preventDefault();
    if (closing || !running.dataset.action) return;
    dismiss(running.dataset.action);
  });

  window.addEventListener("focus", function () {
    if (!ready || closing) return;
    if (document.activeElement === document.body) focusRing();
  });

  // Main pushes a refreshed reading after the ring has been up a few seconds.
  // Its own channel rather than a second `pet-menu-show`: a full payload would
  // make the ring rebuild and drop back to the outer level mid-use.
  if (api && api.onTelemetry) {
    api.onTelemetry(function (telemetry) {
      if (!ready || closing) return;
      paintTelemetry(telemetry);
    });
  }

  if (api && api.onSessions) {
    api.onSessions(function (list) {
      if (closing) return;
      sessionsPending = false;
      sessionsBuilt = true;
      renderSessionChips(list);
      // The same reply names the running conversation, when this payload was
      // the one that asked for it.
      adoptRunningLabel(list);
      // The ring just gained its real chips. Keep the level the user is on and
      // hand the keyboard back to the ring so arrows and number keys work.
      if (view === "sessions") focusRing();
    });
  }

  if (api && api.onShow) {
    api.onShow(build);
  } else {
    // Loaded outside Electron (screenshot harness): render a stand-in payload
    // so the ring can still be inspected without the factory.
    build({
      lang: "en",
      labels: {
        newChat: "New Chat", openAipa: "Open AIPA", stop: "Stop", silence: "Silence",
        resume: "Resume", more: "More", notices: "Notices", settings: "Settings",
        hidePet: "Hide Pet", allCommands: "All Commands", recent: "Recent",
        noRecentChats: "No recent chats", back: "Back",
        close: "Close", nothingRunning: "No turn running",
      },
      // Three rows so the third ring is inspectable without the factory; the
      // real payload comes from AIPA's Codex session reader.
      sessions: [
        { id: "preview-1", label: "Refactor the pet menu ring", when: "5m" },
        { id: "preview-2", label: "Investigate session resume", when: "2h" },
        { id: "preview-3", label: "Polish notification centre", when: "3d" },
      ],
      state: { canStop: false, quiet: false },
      badges: { notices: 3 },
      available: {},
      // Fixed readings so the gauges are inspectable outside Electron too.
      telemetry: { cpu: 0.23, mem: 0.61 },
    });
  }
})();
</script>
</body>
</html>
