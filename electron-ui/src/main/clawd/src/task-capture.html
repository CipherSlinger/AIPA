<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Local-only page: no image, font, fetch or media sources. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* Same two skins as the ASK bar: the SAO HUD slab, and the pet's neutral card
   driven by the body[data-theme] switch and the system colour scheme. */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Author `display` rules outrank the UA [hidden] rule; make the attribute
   authoritative for the inline reason. */
[hidden] { display: none !important; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: "Cascadia Code", "SF Mono", ui-monospace, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

:root {
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --text: #dff7f3;
  --muted: #7fa8a2;
  --accent: #3fe0c8;
  --line: rgba(63, 224, 200, 0.28);
  --line-soft: rgba(63, 224, 200, 0.05);
  --field-bg: rgba(63, 224, 200, 0.035);
  --field-border: rgba(63, 224, 200, 0.16);
  --field-focus: rgba(63, 224, 200, 0.5);
  --row-active: rgba(63, 224, 200, 0.08);
  --error: #ff8b8b;
  --warn: #f0b429;
  --panel-bg:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
    linear-gradient(180deg, rgba(8, 14, 20, 0.94), rgba(4, 10, 14, 0.97));
  --panel-size: 100% 22px, 22px 100%, 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: inset 0 0 28px rgba(63, 224, 200, 0.05);
  --panel-radius: 0;
  --panel-clip: polygon(
    0 12px, 12px 0,
    calc(100% - 18px) 0, 100% 18px,
    100% calc(100% - 10px), calc(100% - 10px) 100%,
    18px 100%, 0 calc(100% - 18px)
  );
  --text-shadow: 0 0 12px rgba(63, 224, 200, 0.10);
}

body[data-theme="clawd"] {
  --text: #18181b;
  --muted: #71717a;
  --accent: #d97757;
  --line: rgba(0, 0, 0, 0.10);
  --line-soft: transparent;
  --field-bg: rgba(0, 0, 0, 0.03);
  --field-border: rgba(0, 0, 0, 0.12);
  --field-focus: rgba(217, 119, 87, 0.55);
  --row-active: rgba(0, 0, 0, 0.045);
  --error: #b42318;
  --warn: #a15c07;
  --panel-bg: linear-gradient(180deg, #fbfbfa, #f4f4f2);
  --panel-size: 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --panel-radius: 16px;
  --panel-clip: none;
  --text-shadow: none;
}
@media (prefers-color-scheme: dark) {
  body[data-theme="clawd"] {
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #d97757;
    --line: rgba(255, 255, 255, 0.10);
    --field-bg: #09090b;
    --field-border: rgba(255, 255, 255, 0.08);
    --field-focus: rgba(217, 119, 87, 0.65);
    --row-active: rgba(255, 255, 255, 0.06);
    --error: #fca5a5;
    --warn: #fbbf24;
    --panel-bg: linear-gradient(180deg, #1b1b1e, #18181b);
    --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
}

body { padding: 8px; }

.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  padding: 12px 14px 12px;
  color: var(--text);
  background: var(--panel-bg);
  background-size: var(--panel-size);
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-radius);
  clip-path: var(--panel-clip);
  filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.45));
  box-shadow: var(--panel-shadow);
  text-shadow: var(--text-shadow);
  opacity: 0;
  transform: translateY(6px) scale(0.985);
  transition: opacity 0.16s linear, transform 0.20s var(--ease);
}
.panel.visible { opacity: 1; transform: none; }

.scan {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 30%;
  pointer-events: none;
  display: none;
  background: linear-gradient(180deg, rgba(63, 224, 200, 0.10), transparent);
  animation: hudScan 5.5s linear infinite;
}
body[data-theme="sao"] .scan { display: block; }
@keyframes hudScan {
  0%   { transform: translateY(-120%); opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(420%); opacity: 0; }
}

.head, .field, .error, .foot { position: relative; z-index: 1; }

.head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: 0 2px 9px;
  border-bottom: 1px solid rgba(63, 224, 200, 0.14);
}
body[data-theme="clawd"] .head { border-bottom-color: var(--line); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before {
  content: "";
  width: 5px;
  height: 5px;
  transform: rotate(45deg);
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  flex: none;
}
body[data-theme="clawd"] .eyebrow::before { box-shadow: none; border-radius: 1px; }
.spacer { flex: 1; }
/* Where the line will land. A label, not a control: there is nowhere else to
   put a capture without turning the bar into a task editor. */
.dest {
  flex: none;
  padding: 2px 6px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
body[data-theme="clawd"] .dest {
  border-radius: 7px;
  font-size: 9px;
  letter-spacing: 0.02em;
  text-transform: none;
}

.field {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  height: 34px;
  margin-top: 7px;
  padding: 0 9px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}
body[data-theme="clawd"] .field { clip-path: none; border-radius: 9px; }
.field:focus-within {
  border-color: var(--field-focus);
  background: var(--field-bg);
  box-shadow: inset 0 0 14px rgba(63, 224, 200, 0.07);
}
body[data-theme="clawd"] .field:focus-within { box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.28); }
.prompt {
  flex: none;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  opacity: 0.9;
}
#input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.01em;
  caret-color: var(--accent);
  user-select: text;
}
#input::placeholder { color: var(--muted); opacity: 0.88; }

.error {
  flex: none;
  min-height: 13px;
  margin-top: 5px;
  padding-left: 7px;
  border-left: 2px solid var(--error);
  font-size: 9.5px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  color: var(--error);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.error[data-kind="empty"] { color: var(--warn); border-left-color: var(--warn); }

/* ── Recognised due day ─────────────────────────────────────────────────────
   A tag under the field, not a form. The typed line is never rewritten; the
   tag only says which day will ride along with it. It hugs its own text, so
   an empty field still has the same width it always had. */
.due {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  max-width: 100%;
  height: 22px;
  margin-top: 7px;
  padding: 0 3px 0 9px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--muted);
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0.01em;
  animation: dueIn 140ms var(--ease) both;
}
body[data-theme="clawd"] .due {
  height: 24px;
  padding: 0 4px 0 10px;
  border-radius: 12px;
  font-size: 11px;
}
@keyframes dueIn {
  from { opacity: 0; transform: translateY(-2px); }
}
.due-text {
  display: inline-block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.due-date {
  color: var(--accent);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.due-clear {
  flex: none;
  width: 18px;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  outline: none;
}
body[data-theme="clawd"] .due-clear {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  line-height: 20px;
}
.due-clear:hover { color: var(--text); background: var(--row-active); }
.due-clear:focus-visible {
  color: var(--text);
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}

/* ── Remembered captures ─────────────────────────────────────────────────────
   Shown only while the field is empty, so a user who never presses ↑ still
   sees that the bar remembers. It is a quiet strip rather than a form
   dropdown: hairline rows with the same accent rail as the brief rows. The
   window grows by this block's measured height, so the panel never clips it
   when main accepts the request; if it does not, the panel clips the strip. */
.suggest {
  position: relative;
  z-index: 1;
  flex: none;
  margin-top: 7px;
}
.suggest-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}
body[data-theme="clawd"] .suggest-list { gap: 2px; border-top: 0; }
.suggest-row {
  position: relative;
  display: block;
  width: 100%;
  height: 28px;
  padding: 0 8px 0 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  line-height: 28px;
  letter-spacing: 0.01em;
  text-align: left;
  cursor: pointer;
  outline: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background 120ms ease;
}
.suggest-row:last-child { border-bottom: 0; }
/* The same accent rail the brief rows use; it lights up on hover and while
   Tab has the row. */
.suggest-row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background: var(--accent);
  opacity: 0.35;
  transition: opacity 120ms ease;
}
.suggest-row:hover::before,
.suggest-row:focus-visible::before { opacity: 0.65; }
.suggest-row:hover,
.suggest-row:focus-visible { background: var(--row-active); }
.suggest-row:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}
body[data-theme="clawd"] .suggest-row::before { display: none; }
body[data-theme="clawd"] .suggest-row {
  font-size: 12px;
  line-height: 28px;
  border-bottom: 0;
  border-radius: 6px;
}

.foot {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
  margin-top: auto;
  padding: 7px 2px 0;
  border-top: 1px solid rgba(63, 224, 200, 0.14);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
body[data-theme="clawd"] .foot { border-top-color: var(--line); }
.hint { display: inline-flex; align-items: center; gap: 5px; }
kbd {
  font: inherit;
  font-size: 8px;
  padding: 1px 4px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  color: var(--text);
  opacity: 0.85;
}
.spacer2 { flex: 1; }
.aipa { opacity: 0.68; }

@media (prefers-reduced-motion: reduce) {
  .panel { transition: none; }
  .field { transition: none; }
  .suggest-row { transition: none; }
  .due { animation: none; }
  .scan { animation: none; opacity: 0.35; }
}
</style>
</head>
<body data-theme="sao">
<div class="panel" id="panel" role="dialog" aria-modal="false">
  <div class="scan" aria-hidden="true"></div>
  <div class="head">
    <span class="eyebrow" id="eyebrow">CAPTURE TASK</span>
    <span class="spacer"></span>
    <span class="dest" id="dest">INBOX</span>
  </div>
  <form class="field" id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="input" type="text" spellcheck="false" autocomplete="off"
           aria-label="Capture a task" />
  </form>
  <div class="due" id="due" hidden>
    <span class="due-text"><span id="duePhrase"></span><span class="due-sep" aria-hidden="true"> · </span><span class="due-date" id="dueDate"></span></span>
    <button class="due-clear" id="dueClear" type="button">×</button>
  </div>
  <div class="error" id="error" role="alert" hidden></div>
  <div class="suggest" id="suggest" hidden>
    <div class="suggest-list" id="suggestList"></div>
  </div>
  <div class="foot">
    <span class="hint"><kbd>Enter</kbd><span id="saveHint">Save</span></span>
    <span class="hint"><kbd>Esc</kbd><span id="cancelHint">Cancel</span></span>
    <span class="spacer2"></span>
    <span class="aipa">AIPA</span>
  </div>
</div>
<script>
(function () {
  "use strict";

  var api = window.taskCaptureAPI || null;
  var panel = document.getElementById("panel");
  var eyebrow = document.getElementById("eyebrow");
  var dest = document.getElementById("dest");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var errorEl = document.getElementById("error");
  var suggestEl = document.getElementById("suggest");
  var suggestList = document.getElementById("suggestList");
  var dueEl = document.getElementById("due");
  var duePhrase = document.getElementById("duePhrase");
  var dueDate = document.getElementById("dueDate");
  var dueClear = document.getElementById("dueClear");
  var saveHint = document.getElementById("saveHint");
  var cancelHint = document.getElementById("cancelHint");

  var labels = {
    eyebrow: "Capture task",
    placeholder: "What needs doing?",
    save: "Save",
    cancel: "Cancel",
    empty: "Enter a task first",
    failed: "Could not save the task",
    savedTitle: "Saved to Inbox",
    savedPill: "INBOX",
    dueLabel: "Due date",
    dueClear: "Remove due date"
  };

  // The page's own language, used only to spell the recognised day.
  var lang = "en";
  // The day the last parse resolved to, or null. Riding along with the save.
  var due = null;
  // Set by ×: the same line keeps its day hidden until the text changes.
  var dueDismissed = false;

  var composing = false;
  // True only for the keystroke that confirmed an IME composition. The submit
  // fires during that same keydown, before the flag can be cleared.
  var imeEnter = false;
  // A save is one synchronous store write; this only stops a double Enter from
  // sending two. Main closes the window on success and sends a reason on
  // failure, which clears it.
  var saving = false;
  // Newest first. Main sends it on every open; the walk never outlives the bar.
  var history = [];
  // -1 = the draft; 0 = newest saved capture. Increasing walks back in time.
  var recallIndex = -1;
  // What the field held when the walk began, restored at the bottom.
  var draft = "";
  // How many rows of history the strip may show. The whole list still walks.
  var SUGGEST_LIMIT = 5;
  // Last extra height sent to main, so an idle render does not spam resize.
  var lastExtra = -1;

  // <due-parser>
  // ── Due-phrase parser ──────────────────────────────────────────────────────
  // Self-contained on purpose: the parser probe lifts this block verbatim and
  // runs it against a pinned clock, so it may not read anything above it.
  // Deliberately narrow: only the phrases listed below, only as standalone
  // words, and the first one in the line wins. The typed title is never
  // rewritten — the matched phrase only decides which day rides along.
  // Day maths stays in local parts (`new Date(y, m - 1, d)`) so a DST shift or
  // a month rollover is decided by the calendar, never by an instant.

  var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                   "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  // Chinese weekday index by character; 0 is Sunday.
  var WEEKDAY_ZH = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "日": 0, "天": 0 };
  var WEEKDAY_EN = {
    sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6,
    sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6
  };
  var OFFSET_ZH = { "今天": 0, "明天": 1, "后天": 2, "大后天": 3 };

  function pad2(n) {
    return (n < 10 ? "0" : "") + n;
  }

  /** Local calendar day, or null when the parts are not a real day. */
  function localDay(y, m, d) {
    if (!(y >= 2000 && y <= 2100)) return null;
    var date = new Date(y, m - 1, d);
    if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
    return date;
  }

  function todayParts(date) {
    return { y: date.getFullYear(), m: date.getMonth() + 1, d: date.getDate(), dow: date.getDay() };
  }

  function addDays(today, n) {
    var date = new Date(today.y, today.m - 1, today.d + n);
    return { y: date.getFullYear(), m: date.getMonth() + 1, d: date.getDate() };
  }

  /** A month/day with no year: the next occurrence, today included. */
  function nextOccurrence(today, month, day) {
    var base = new Date(today.y, today.m - 1, today.d).getTime();
    // Feb 29 exists in only one year out of four, so walking one year forward
    // would drop the most memorable date there is. The bound is small and
    // finite; the localDay check still owns leap years (2100 is not one).
    for (var y = today.y; y <= today.y + 8; y++) {
      var date = localDay(y, month, day);
      if (date && date.getTime() >= base) return date;
    }
    return null;
  }

  function weekdayFrom(today, target) {
    // Today counts: "Friday" typed on a Friday means today.
    var d = addDays(today, (target - today.dow + 7) % 7);
    return localDay(d.y, d.m, d.d);
  }

  function dueOnOf(date) {
    return pad2(date.getFullYear()) + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  /** A word or a number may not continue into the match from either side. */
  function standalone(text, index, length) {
    var before = index > 0 ? text.charAt(index - 1) : "";
    var after = index + length < text.length ? text.charAt(index + length) : "";
    if (before && /[A-Za-z0-9\/.\-]/.test(before)) return false;
    if (after && /[A-Za-z0-9\/.]/.test(after)) return false;
    return true;
  }

  /**
   * First matching phrase in the text, or null. `today` is a parts object so
   * the caller can pin the clock (the probe script does exactly that).
   */
  function parseDue(text, today) {
    if (typeof text !== "string" || !text) return null;
    var found = [];

    function offer(match, resolve, needsStandalone) {
      if (!match) return;
      if (needsStandalone && !standalone(text, match.index, match[0].length)) return;
      var date = resolve(match);
      if (!date) return;
      found.push({
        index: match.index,
        phrase: match[0],
        dueOn: dueOnOf(date),
        date: date
      });
    }

    // An explicit ISO day is unambiguous, so it is collected first; the M/D
    // rule below must not read "11-05" out of the middle of it.
    var iso = /(\d{4})-(\d{2})-(\d{2})/.exec(text);
    offer(iso, function (m) { return localDay(+m[1], +m[2], +m[3]); }, true);
    var isoEnd = iso ? iso.index + iso[0].length : -1;

    // Chinese: relative days first (longest alternative first, so 大后天 never
    // degrades to 后天), then weekdays, then a month/day.
    offer(/(大后天|后天|明天|今天)/.exec(text), function (m) {
      var d = addDays(today, OFFSET_ZH[m[1]]);
      return localDay(d.y, d.m, d.d);
    }, false);

    offer(/(\d{1,3})\s*天后/.exec(text), function (m) {
      var d = addDays(today, +m[1]);
      return localDay(d.y, d.m, d.d);
    }, true);

    offer(/(下周|周)([一二三四五六日天])/.exec(text), function (m) {
      // 上周五 is a day that has already been; pretending it is next week's
      // Friday would put a wrong deadline on a note about the past.
      if (m.index > 0 && text.charAt(m.index - 1) === "上") return null;
      var target = WEEKDAY_ZH[m[2]];
      var delta;
      if (m[1] === "下周") {
        // The X of the next Monday-started week, the everyday reading.
        var toMonday = (1 - today.dow + 7) % 7 || 7;
        delta = toMonday + (target === 0 ? 6 : target - 1);
      } else {
        delta = (target - today.dow + 7) % 7;
      }
      var d = addDays(today, delta);
      return localDay(d.y, d.m, d.d);
    }, false);

    offer(/(\d{1,2})月(\d{1,2})[日号]/.exec(text), function (m) {
      return nextOccurrence(today, +m[1], +m[2]);
    }, true);

    // English: single words and phrases, bounded so "tomorrowland" is not a day.
    offer(/\b(today|tomorrow|tonight)\b/i.exec(text), function (m) {
      var d = addDays(today, m[1].toLowerCase() === "tomorrow" ? 1 : 0);
      return localDay(d.y, d.m, d.d);
    }, false);

    // Full names are words of their own; the three-letter forms are also
    // ordinary English ("buy a sun lamp", "I sat with the client"), so they
    // only count when written the way a date is: capitalised.
    offer(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.exec(text), function (m) {
      // "last Friday" is behind us; a due day cannot point there.
      if (/(?:last|previous|past)\s+$/i.test(text.slice(0, m.index))) return null;
      return weekdayFrom(today, WEEKDAY_EN[m[1].toLowerCase()]);
    }, false);

    offer(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/.exec(text), function (m) {
      if (/(?:last|previous|past)\s+$/i.test(text.slice(0, m.index))) return null;
      return weekdayFrom(today, WEEKDAY_EN[m[1].toLowerCase()]);
    }, false);

    offer(/\bnext\s+week\b/i.exec(text), function () {
      var d = addDays(today, 7);
      return localDay(d.y, d.m, d.d);
    }, false);

    offer(/\bin\s+(\d{1,3})\s+days?\b/i.exec(text), function (m) {
      var d = addDays(today, +m[1]);
      return localDay(d.y, d.m, d.d);
    }, false);

    // M/D (year optional) and M-D-YYYY. A bare M-D is not a date here: "5-10
    // min" and "2024-2025" are ranges far more often than they are days, and a
    // wrong day rides into the saved task. Nor is a slash date followed by a
    // unit — "2/3 of the budget", "5/8 cup" — a fraction, not a deadline. The
    // scan walks past shapes it cannot use (and past the inside of an ISO day)
    // instead of giving up on the line.
    var MD_UNIT = /^\s*(?:%|percent|mins?\b|minutes?\b|h\b|hrs?\b|hours?\b|days?\b|weeks?\b|wks?\b|months?\b|x\b|times?\b|of\b|cups?\b|people\b|persons?\b|items?\b|pages?\b|chars?\b|words?\b|分|小时|天|周|个月|倍|人|页|字|条|次)/i;
    var mdRe = /(\d{1,2})([\/-])(\d{1,2})(?:[\/-](\d{2,4}))?/g;
    var md;
    while ((md = mdRe.exec(text)) !== null) {
      if (isoEnd > 0 && md.index < isoEnd && md.index + md[0].length > iso.index) continue;
      if (!standalone(text, md.index, md[0].length)) continue;
      // The hyphen form needs its year to be a date at all.
      if (md[2] === "-" && !md[4]) continue;
      if (!md[4] && MD_UNIT.test(text.slice(md.index + md[0].length))) continue;
      var year = md[4] ? +md[4] : 0;
      if (year && year < 100) year += 2000;
      var date = year
        ? localDay(year, +md[1], +md[3])
        : nextOccurrence(today, +md[1], +md[3]);
      if (!date) continue;
      found.push({
        index: md.index,
        phrase: md[0],
        dueOn: dueOnOf(date),
        date: date
      });
    }

    if (!found.length) return null;
    found.sort(function (a, b) { return a.index - b.index; });
    return found[0];
  }
  // </due-parser>

  /** The day as the bar spells it: 11月1日 / Nov 1 / 11월 1일. */
  function formatChipDate(date, today) {
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();
    if (lang === "zh") return y !== today.y ? y + "年" + m + "月" + d + "日" : m + "月" + d + "日";
    if (lang === "ko") return y !== today.y ? y + "년 " + m + "월 " + d + "일" : m + "월 " + d + "일";
    return y !== today.y ? MONTHS_EN[m - 1] + " " + d + ", " + y : MONTHS_EN[m - 1] + " " + d;
  }

  /**
   * Re-read the line and show the day it names. Nothing here touches the
   * input: no value rewrite, no selection, no focus.
   */
  function renderDue() {
    var today = todayParts(new Date());
    var match = parseDue(input.value, today);
    due = match && !dueDismissed ? match : null;
    if (!due) {
      dueEl.hidden = true;
      dueEl.removeAttribute("aria-label");
      return;
    }
    duePhrase.textContent = due.phrase;
    dueDate.textContent = formatChipDate(due.date, today);
    dueEl.setAttribute("aria-label", labels.dueLabel + ": " + due.phrase + " · " + dueDate.textContent);
    dueEl.hidden = false;
  }

  function applyLabels() {
    eyebrow.textContent = labels.eyebrow;
    dest.textContent = labels.savedPill;
    input.placeholder = labels.placeholder;
    input.setAttribute("aria-label", labels.placeholder);
    saveHint.textContent = labels.save;
    cancelHint.textContent = labels.cancel;
    dueClear.setAttribute("aria-label", labels.dueClear);
    panel.setAttribute("aria-label", labels.eyebrow);
  }

  function placeCaretAtEnd() {
    try {
      var end = input.value.length;
      input.setSelectionRange(end, end);
    } catch (err) { /* not focusable yet */ }
  }

  /**
   * The strip is a suggestion, never a mode: it exists only while there is
   * something to remember and nothing typed. Any text in the field means the
   * user is drafting, so the rows get out of the way.
   */
  function suggestVisible() {
    return !saving && history.length > 0 && input.value.length === 0;
  }

  /** The real height a block adds to the panel, gap above it included. */
  function blockHeight(el) {
    if (!el || el.hidden) return 0;
    var margin = parseFloat(window.getComputedStyle(el).marginTop) || 0;
    return Math.round(el.getBoundingClientRect().height + margin);
  }

  /**
   * Ask main for exactly the room the blocks below the field occupy. Main owns
   * the ceiling and the work-area clamp; the measurement is the page's real
   * height so a shorter list does not reserve five rows of empty space, and a
   * one-line due tag does not reserve a strip.
   */
  function requestExtraHeight() {
    var extra = blockHeight(dueEl) + blockHeight(suggestEl);
    if (extra === lastExtra) return;
    lastExtra = extra;
    if (api && typeof api.resize === "function") api.resize(extra);
  }

  /** Everything below the field is derived from the line; draw it together. */
  function refresh() {
    renderDue();
    renderSuggestions();
  }

  function buildSuggestionRow(text, index) {
    var row = document.createElement("button");
    row.type = "button";
    row.className = "suggest-row";
    row.textContent = text;
    // The row ellipsizes; the whole saved line stays reachable on hover.
    row.title = text;
    row.addEventListener("click", function (event) {
      event.preventDefault();
      insertFromSuggestion(index);
    });
    return row;
  }

  function renderSuggestions() {
    if (!suggestVisible()) {
      suggestEl.hidden = true;
      if (suggestList.childNodes.length) suggestList.replaceChildren();
      requestExtraHeight();
      return;
    }
    suggestEl.hidden = false;
    suggestList.replaceChildren();
    for (var i = 0; i < history.length && i < SUGGEST_LIMIT; i++) {
      suggestList.appendChild(buildSuggestionRow(history[i], i));
    }
    requestExtraHeight();
  }

  /**
   * A click (or Enter on a Tab-focused row) fills the field; it never saves
   * and never submits. The strip collapses on its own because the field is no
   * longer empty, which also hands the extra height back to main.
   */
  function insertFromSuggestion(index) {
    if (!history[index]) return;
    recallIndex = -1;
    draft = "";
    input.value = history[index];
    dueDismissed = false;
    if (!errorEl.hidden) clearError();
    try { input.focus(); } catch (err) { /* window may be going away */ }
    placeCaretAtEnd();
    refresh();
  }

  /**
   * One step along the walk: negative is older (↑), positive is newer (↓).
   * The draft sits one step below the newest entry and is restored there.
   * Mirrors the ASK bar's rule exactly.
   */
  function recallHistory(step) {
    if (history.length === 0) return false;
    if (step < 0) {
      if (recallIndex < 0) {
        draft = input.value;
        recallIndex = 0;
      } else if (recallIndex < history.length - 1) {
        recallIndex += 1;
      } else {
        // Already at the oldest entry; the key is consumed but nothing moves.
        return true;
      }
    } else {
      if (recallIndex < 0) return false;
      if (recallIndex > 0) {
        recallIndex -= 1;
      } else {
        recallIndex = -1;
        input.value = draft;
        dueDismissed = false;
        placeCaretAtEnd();
        refresh();
        return true;
      }
    }
    input.value = history[recallIndex];
    dueDismissed = false;
    placeCaretAtEnd();
    refresh();
    return true;
  }

  function clearError() {
    errorEl.hidden = true;
    errorEl.textContent = "";
    errorEl.removeAttribute("data-kind");
  }

  function showError(message, kind) {
    errorEl.textContent = message || labels.failed;
    errorEl.dataset.kind = kind || "error";
    errorEl.hidden = false;
  }

  function submit() {
    if (saving) return;
    // Enter that commits an IME composition is not a save. The browser fires
    // `compositionend` between the keydown and this submit, so the flag read
    // alone is not enough; `imeEnter` remembers the exact keystroke.
    if (composing || imeEnter) {
      imeEnter = false;
      return;
    }
    if (!input.value.trim()) {
      showError(labels.empty, "empty");
      try { input.focus(); } catch (err) { /* window may be going away */ }
      return;
    }
    if (!api) return;
    saving = true;
    // The typed line goes as typed; only the resolved day rides beside it.
    api.save(input.value, due ? due.dueOn : null);
  }

  function show(payload) {
    var data = payload || {};
    if (data.labels) {
      for (var key in data.labels) {
        if (Object.prototype.hasOwnProperty.call(data.labels, key)) {
          labels[key] = data.labels[key];
        }
      }
    }
    lang = data.lang === "zh" || data.lang === "ko" ? data.lang : "en";
    document.documentElement.lang = lang;
    document.body.dataset.theme = data.theme === "clawd" ? "clawd" : "sao";
    applyLabels();

    // History arrives newest first. Only usable entries are kept, and the cap
    // is main's: a malformed payload cannot grow the walk beyond what the
    // store holds.
    history = [];
    if (Array.isArray(data.history)) {
      for (var h = 0; h < data.history.length && history.length < 20; h++) {
        var item = data.history[h];
        if (typeof item !== "string" || !item) continue;
        history.push(item);
      }
    }
    recallIndex = -1;
    draft = "";
    lastExtra = -1;

    composing = false;
    imeEnter = false;
    saving = false;
    due = null;
    dueDismissed = false;
    input.value = "";
    clearError();

    // Run before ready(): the resize request reaches main ahead of the reveal
    // handshake, so the bar is first shown at its final height rather than
    // growing in front of the user.
    refresh();

    panel.classList.add("visible");
    window.setTimeout(function () {
      if (api) api.ready();
      try { input.focus(); } catch (err) { /* not focusable yet */ }
    }, 0);
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    submit();
  });

  input.addEventListener("compositionstart", function () {
    composing = true;
  });
  input.addEventListener("compositionend", function () {
    composing = false;
  });
  input.addEventListener("keydown", function (event) {
    // An IME owns the keys it is consuming: Enter commits the composition and
    // must not also file a task. 229 is the legacy keyCode Chromium reports
    // while an IME owns the key.
    if (composing || event.isComposing || event.keyCode === 229) {
      if (event.key === "Enter") {
        imeEnter = true;
        window.setTimeout(function () { imeEnter = false; }, 0);
      }
      return;
    }
    // ↑ walks back through saved captures, ↓ walks forward and finally puts the
    // draft back. Both consume the key so the caret does not jump instead.
    if (event.key === "ArrowUp") {
      if (recallHistory(-1)) event.preventDefault();
      return;
    }
    if (event.key === "ArrowDown") {
      if (recallHistory(1)) event.preventDefault();
    }
  });
  input.addEventListener("input", function () {
    // Typing after a recall makes the field a draft again: the walk is a
    // shortcut borrowed from the past, not a mode the field stays in. The
    // remembered-titles strip is part of that borrowed mode: any text hides it
    // and the window gives the extra room back.
    recallIndex = -1;
    draft = "";
    // A dismissed day is dismissed for that line only; retyping the phrase
    // brings it back.
    dueDismissed = false;
    // A reason about the previous attempt stops applying once the line changes.
    if (!errorEl.hidden) clearError();
    refresh();
  });

  // The × must not take focus from the field: the caret stays where the user
  // left it and the bar keeps reading keys. Dismissing hides the day, never
  // the text, and the next edit may offer it again.
  dueClear.addEventListener("mousedown", function (event) {
    event.preventDefault();
  });
  dueClear.addEventListener("click", function (event) {
    event.preventDefault();
    dueDismissed = true;
    due = null;
    dueEl.hidden = true;
    dueEl.removeAttribute("aria-label");
    requestExtraHeight();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      // While composing, Escape means "cancel the IME composition", not
      // "dismiss the bar".
      if (event.isComposing) return;
      event.preventDefault();
      if (api) api.close();
    }
  });

  // Discoverability only: the arrows walk the saved captures. A bare glyph
  // rather than a new string, so this page adds nothing to the i18n table.
  (function addRecallGlyph() {
    var keys = document.createElement("span");
    keys.textContent = "↑↓";
    keys.setAttribute("aria-hidden", "true");
    keys.style.opacity = "0.72";
    saveHint.parentNode.appendChild(keys);
  })();

  if (api) {
    api.onShow(show);
    api.onError(function (data) {
      saving = false;
      showError(data && data.message, data && data.kind);
      try { input.focus(); } catch (err) { /* not focusable */ }
    });
    api.onFocus(function () {
      try { input.focus(); } catch (err) { /* not focusable */ }
    });
  } else {
    // Loaded outside Electron (screenshot harness): show the finished surface.
    show({ lang: "en", theme: "sao", labels: labels });
  }
})();
</script>
</body>
</html>
