<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Local-only page: no image, font, fetch or media sources. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* Same two skins as the ASK bar: the SAO HUD slab, and the pet's neutral card
   driven by the body[data-theme] switch and the system colour scheme. */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Author `display` rules outrank the UA [hidden] rule; make the attribute
   authoritative for the inline reason. */
[hidden] { display: none !important; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: "Cascadia Code", "SF Mono", ui-monospace, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

:root {
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --text: #dff7f3;
  --muted: #7fa8a2;
  --accent: #3fe0c8;
  --line: rgba(63, 224, 200, 0.28);
  --line-soft: rgba(63, 224, 200, 0.05);
  --field-bg: rgba(63, 224, 200, 0.035);
  --field-border: rgba(63, 224, 200, 0.16);
  --field-focus: rgba(63, 224, 200, 0.5);
  --row-active: rgba(63, 224, 200, 0.08);
  --error: #ff8b8b;
  --warn: #f0b429;
  --panel-bg:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
    linear-gradient(180deg, rgba(8, 14, 20, 0.94), rgba(4, 10, 14, 0.97));
  --panel-size: 100% 22px, 22px 100%, 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: inset 0 0 28px rgba(63, 224, 200, 0.05);
  --panel-radius: 0;
  --panel-clip: polygon(
    0 12px, 12px 0,
    calc(100% - 18px) 0, 100% 18px,
    100% calc(100% - 10px), calc(100% - 10px) 100%,
    18px 100%, 0 calc(100% - 18px)
  );
  --text-shadow: 0 0 12px rgba(63, 224, 200, 0.10);
}

body[data-theme="clawd"] {
  --text: #18181b;
  --muted: #71717a;
  --accent: #d97757;
  --line: rgba(0, 0, 0, 0.10);
  --line-soft: transparent;
  --field-bg: rgba(0, 0, 0, 0.03);
  --field-border: rgba(0, 0, 0, 0.12);
  --field-focus: rgba(217, 119, 87, 0.55);
  --row-active: rgba(0, 0, 0, 0.045);
  --error: #b42318;
  --warn: #a15c07;
  --panel-bg: linear-gradient(180deg, #fbfbfa, #f4f4f2);
  --panel-size: 100% 100%;
  --panel-border: var(--line);
  --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --panel-radius: 16px;
  --panel-clip: none;
  --text-shadow: none;
}
@media (prefers-color-scheme: dark) {
  body[data-theme="clawd"] {
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #d97757;
    --line: rgba(255, 255, 255, 0.10);
    --field-bg: #09090b;
    --field-border: rgba(255, 255, 255, 0.08);
    --field-focus: rgba(217, 119, 87, 0.65);
    --row-active: rgba(255, 255, 255, 0.06);
    --error: #fca5a5;
    --warn: #fbbf24;
    --panel-bg: linear-gradient(180deg, #1b1b1e, #18181b);
    --panel-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
}

body { padding: 8px; }

.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  padding: 12px 14px 12px;
  color: var(--text);
  background: var(--panel-bg);
  background-size: var(--panel-size);
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-radius);
  clip-path: var(--panel-clip);
  filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.45));
  box-shadow: var(--panel-shadow);
  text-shadow: var(--text-shadow);
  opacity: 0;
  transform: translateY(6px) scale(0.985);
  transition: opacity 0.16s linear, transform 0.20s var(--ease);
}
.panel.visible { opacity: 1; transform: none; }

.scan {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 30%;
  pointer-events: none;
  display: none;
  background: linear-gradient(180deg, rgba(63, 224, 200, 0.10), transparent);
  animation: hudScan 5.5s linear infinite;
}
body[data-theme="sao"] .scan { display: block; }
@keyframes hudScan {
  0%   { transform: translateY(-120%); opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(420%); opacity: 0; }
}

.head, .field, .error, .saved-inline, .foot { position: relative; z-index: 1; }

.head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: 0 2px 9px;
  border-bottom: 1px solid rgba(63, 224, 200, 0.14);
}
body[data-theme="clawd"] .head { border-bottom-color: var(--line); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before {
  content: "";
  width: 5px;
  height: 5px;
  transform: rotate(45deg);
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  flex: none;
}
body[data-theme="clawd"] .eyebrow::before { box-shadow: none; border-radius: 1px; }
.spacer { flex: 1; }
/* Where the line will land. A label, not a control: there is nowhere else to
   put a capture without turning the bar into a task editor. */
.dest {
  flex: none;
  padding: 2px 6px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
body[data-theme="clawd"] .dest {
  border-radius: 7px;
  font-size: 9px;
  letter-spacing: 0.02em;
  text-transform: none;
}

.field {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  height: 34px;
  margin-top: 7px;
  padding: 0 9px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}
body[data-theme="clawd"] .field { clip-path: none; border-radius: 9px; }
.field:focus-within {
  border-color: var(--field-focus);
  background: var(--field-bg);
  box-shadow: inset 0 0 14px rgba(63, 224, 200, 0.07);
}
body[data-theme="clawd"] .field:focus-within { box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.28); }
.prompt {
  flex: none;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  opacity: 0.9;
}
#input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.01em;
  caret-color: var(--accent);
  user-select: text;
}
#input::placeholder { color: var(--muted); opacity: 0.88; }

.error {
  flex: none;
  min-height: 13px;
  margin-top: 5px;
  padding-left: 7px;
  border-left: 2px solid var(--error);
  font-size: 9.5px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  color: var(--error);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.error[data-kind="empty"] { color: var(--warn); border-left-color: var(--warn); }

/* ── Saved, staying open ─────────────────────────────────────────────────────
   Shift+Enter files the line without closing the bar, so the confirmation
   lives inside it. It sits where the chips did, with the same accent rail the
   remembered-captures strip uses, and is measured like every other block under
   the field so the window grows to hold it instead of clipping it. It is a
   confirmation, not a status: typing the next line takes it away. */
.saved-inline {
  flex: none;
  margin-top: 6px;
  padding-left: 7px;
  border-left: 2px solid var(--accent);
  font-size: 9.5px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  color: var(--accent);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
body[data-theme="clawd"] .saved-inline { font-size: 10.5px; }

/* ── Recognised due day ─────────────────────────────────────────────────────
   A tag under the field, not a form. The typed line is never rewritten; the
   tag only says which day will ride along with it. It hugs its own text, so
   an empty field still has the same width it always had. */
/* The recognised day and cadence sit on one line under the field: they are
   two answers to "when", not two stacked forms. The row carries the gap above
   it so a bar with both chips still reserves exactly one chip's height. */
.chips {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 5px;
  flex: none;
  max-width: 100%;
  margin-top: 7px;
}
.due {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  max-width: 100%;
  height: 22px;
  padding: 0 3px 0 9px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--muted);
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0.01em;
  animation: dueIn 140ms var(--ease) both;
}
body[data-theme="clawd"] .due {
  height: 24px;
  padding: 0 4px 0 10px;
  border-radius: 12px;
  font-size: 11px;
}
@keyframes dueIn {
  from { opacity: 0; transform: translateY(-2px); }
}
.due-text {
  display: inline-block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.due-date {
  display: inline-block;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: inherit;
  font-weight: 700;
  line-height: inherit;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  outline: none;
}
/* The date is a button, but it must read as the same ink until the pointer or
   Tab says there is something behind it. The rule sits inside the box so the
   chip's ellipsis clip cannot eat it. */
.due-date:hover,
.due-date:focus-visible {
  color: var(--text);
  box-shadow: inset 0 -1px 0 currentColor;
}
.due-date:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}
.due-clear {
  flex: none;
  width: 18px;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  outline: none;
}
body[data-theme="clawd"] .due-clear {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  line-height: 20px;
}
.due-clear:hover { color: var(--text); background: var(--row-active); }
.due-clear:focus-visible {
  color: var(--text);
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}

/* ── Recognised cadence ──────────────────────────────────────────────────────
   The same tag as the day, sitting beside it. It is the strip's trigger, so it
   is a button; the shared `.due` skin keeps the two chips one object. */
.repeat {
  margin-top: 0;
  padding: 0 9px;
  color: var(--accent);
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  outline: none;
}
body[data-theme="clawd"] .repeat { font-size: 11px; }
.repeat:hover,
.repeat:focus-visible {
  color: var(--text);
  box-shadow: inset 0 -1px 0 currentColor;
}
.repeat:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}

/* ── Preset days ─────────────────────────────────────────────────────────────
   The day in the chip is only a guess, and retyping the phrase is a poor way
   to correct it. This strip is the middle ground: directly under the chip,
   three local calendar days in the same ink and type as the footer hints.
   It is a block below the field like the chip and the suggestion list, so it
   rides the same measured-height path and is never clipped by the bar. */
.due-presets {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  display: inline-flex;
  gap: 4px;
  flex: none;
  margin-top: 5px;
}
.due-preset {
  flex: none;
  height: 22px;
  padding: 0 7px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--muted);
  font: inherit;
  font-size: 8px;
  font-weight: 700;
  line-height: 20px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
  outline: none;
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
}
body[data-theme="clawd"] .due-preset {
  height: 24px;
  padding: 0 9px;
  line-height: 22px;
  border-radius: 6px;
  clip-path: none;
  letter-spacing: 0.02em;
  text-transform: none;
  font-size: 9px;
}
/* The day the chip already shows, so the strip never asks the user to guess
   which of the three is currently in force. */
.due-preset[aria-current="true"] {
  color: var(--text);
  border-color: var(--field-focus);
  background: var(--row-active);
}
.due-preset:hover {
  color: var(--text);
  background: var(--row-active);
}
.due-preset:focus-visible {
  color: var(--text);
  background: var(--row-active);
  border-color: var(--field-focus);
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}

/* ── Remembered captures ─────────────────────────────────────────────────────
   Shown only while the field is empty, so a user who never presses ↑ still
   sees that the bar remembers. It is a quiet strip rather than a form
   dropdown: hairline rows with the same accent rail as the brief rows. The
   window grows by this block's measured height, so the panel never clips it
   when main accepts the request; if it does not, the panel clips the strip. */
.suggest {
  position: relative;
  z-index: 1;
  flex: none;
  margin-top: 7px;
}
.suggest-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}
body[data-theme="clawd"] .suggest-list { gap: 2px; border-top: 0; }
.suggest-row {
  position: relative;
  display: block;
  width: 100%;
  height: 28px;
  padding: 0 8px 0 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  line-height: 28px;
  letter-spacing: 0.01em;
  text-align: left;
  cursor: pointer;
  outline: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background 120ms ease;
}
.suggest-row:last-child { border-bottom: 0; }
/* The same accent rail the brief rows use; it lights up on hover and while
   Tab has the row. */
.suggest-row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background: var(--accent);
  opacity: 0.35;
  transition: opacity 120ms ease;
}
.suggest-row:hover::before,
.suggest-row:focus-visible::before { opacity: 0.65; }
.suggest-row:hover,
.suggest-row:focus-visible { background: var(--row-active); }
.suggest-row:focus-visible {
  outline: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: -1px;
}
body[data-theme="clawd"] .suggest-row::before { display: none; }
body[data-theme="clawd"] .suggest-row {
  font-size: 12px;
  line-height: 28px;
  border-bottom: 0;
  border-radius: 6px;
}

/* Three hints now share one line at 368 px. The type is a point smaller and
   the tracking is gone so the Shift+Enter line fits without wrapping the bar
   into a second row; the spacer still pushes the mark to the right edge. */
.foot {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: none;
  margin-top: auto;
  padding: 7px 2px 0;
  border-top: 1px solid rgba(63, 224, 200, 0.14);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0;
  white-space: nowrap;
  text-transform: uppercase;
  color: var(--muted);
}
body[data-theme="clawd"] .foot { border-top-color: var(--line); }
.hint { display: inline-flex; align-items: center; gap: 5px; flex: none; }
kbd {
  font: inherit;
  font-size: 7px;
  padding: 1px 4px;
  border: 1px solid var(--field-border);
  border-radius: 2px;
  color: var(--text);
  opacity: 0.85;
}
.spacer2 { flex: 1; }
.aipa { opacity: 0.68; }

@media (prefers-reduced-motion: reduce) {
  .panel { transition: none; }
  .field { transition: none; }
  .suggest-row { transition: none; }
  .due { animation: none; }
  .scan { animation: none; opacity: 0.35; }
}
</style>
</head>
<body data-theme="sao">
<div class="panel" id="panel" role="dialog" aria-modal="false">
  <div class="scan" aria-hidden="true"></div>
  <div class="head">
    <span class="eyebrow" id="eyebrow">CAPTURE TASK</span>
    <span class="spacer"></span>
    <span class="dest" id="dest">INBOX</span>
  </div>
  <form class="field" id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="input" type="text" spellcheck="false" autocomplete="off"
           aria-label="Capture a task" />
  </form>
  <div class="chips" id="chips" hidden>
    <div class="due" id="due" hidden>
      <span class="due-text"><span id="duePhrase"></span><span class="due-sep" id="dueSep" aria-hidden="true"> · </span><button class="due-date" id="dueDate" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="duePresets"
              aria-label="Change the due day"></button></span>
      <button class="due-clear" id="dueClear" type="button">×</button>
    </div>
    <button class="due repeat" id="repeat" type="button"
            aria-haspopup="true" aria-expanded="false" aria-controls="repeatPresets" hidden>
      <span class="due-text" id="repeatText"></span>
    </button>
  </div>
  <div class="due-presets" id="duePresets" role="group" aria-label="Change the due day" hidden>
    <button class="due-preset" id="duePresetToday" type="button" data-days="0">Today</button>
    <button class="due-preset" id="duePresetTomorrow" type="button" data-days="1">Tomorrow</button>
    <button class="due-preset" id="duePresetNextWeek" type="button" data-days="7">Next week</button>
  </div>
  <div class="due-presets" id="repeatPresets" role="group" aria-label="Change the repeat" hidden>
    <button class="due-preset" id="repeatPresetNone" type="button" data-repeat="none">Doesn't repeat</button>
    <button class="due-preset" id="repeatPresetDaily" type="button" data-repeat="daily">Every day</button>
    <button class="due-preset" id="repeatPresetWeekly" type="button" data-repeat="weekly">Every week</button>
    <button class="due-preset" id="repeatPresetMonthly" type="button" data-repeat="monthly">Every month</button>
  </div>
  <div class="error" id="error" role="alert" hidden></div>
  <div class="saved-inline" id="savedInline" role="status" hidden></div>
  <div class="suggest" id="suggest" hidden>
    <div class="suggest-list" id="suggestList"></div>
  </div>
  <div class="foot">
    <span class="hint"><kbd>Enter</kbd><span id="saveHint">Save</span></span>
    <span class="hint"><kbd>Esc</kbd><span id="cancelHint">Cancel</span></span>
    <span class="hint"><span id="stayHint"></span></span>
    <span class="spacer2"></span>
    <span class="aipa">AIPA</span>
  </div>
</div>
<script>
(function () {
  "use strict";

  var api = window.taskCaptureAPI || null;
  var panel = document.getElementById("panel");
  var eyebrow = document.getElementById("eyebrow");
  var dest = document.getElementById("dest");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var errorEl = document.getElementById("error");
  var savedInlineEl = document.getElementById("savedInline");
  var suggestEl = document.getElementById("suggest");
  var suggestList = document.getElementById("suggestList");
  var chipsEl = document.getElementById("chips");
  var dueEl = document.getElementById("due");
  var duePhrase = document.getElementById("duePhrase");
  var dueSep = document.getElementById("dueSep");
  var dueDate = document.getElementById("dueDate");
  var dueClear = document.getElementById("dueClear");
  var duePresets = document.getElementById("duePresets");
  var repeatEl = document.getElementById("repeat");
  var repeatText = document.getElementById("repeatText");
  var repeatPresets = document.getElementById("repeatPresets");
  // The strip's four cadences, in reading order. `value` is the store's own
  // vocabulary; null is "no repeat", which is not sent at all on create.
  var repeatPresetButtons = [
    { el: document.getElementById("repeatPresetNone"), value: null, key: "repeatNone" },
    { el: document.getElementById("repeatPresetDaily"), value: "daily", key: "repeatDaily" },
    { el: document.getElementById("repeatPresetWeekly"), value: "weekly", key: "repeatWeekly" },
    { el: document.getElementById("repeatPresetMonthly"), value: "monthly", key: "repeatMonthly" }
  ];
  // The strip's days, in reading order. `days` is a local calendar offset;
  // "next week" is today + 7, not "+7 × 86400000" — see choosePreset.
  var presetButtons = [
    { el: document.getElementById("duePresetToday"), days: 0, key: "dueToday" },
    { el: document.getElementById("duePresetTomorrow"), days: 1, key: "dueTomorrow" },
    { el: document.getElementById("duePresetNextWeek"), days: 7, key: "dueNextWeek" }

  var cancelHint = document.getElementById("cancelHint");

    eyebrow: "Capture task",
    placeholder: "What needs doing?",
    save: "Save",
    cancel: "Cancel",
    empty: "Enter a task first",
    failed: "Could not save the task",
    stayHint: "Shift+Enter saves and keeps this bar open",
    savedInline: "Saved · next one?",
    savedTitle: "Saved to Inbox",
    savedPill: "INBOX",
    dueLabel: "Due date",
    dueClear: "Remove due date",
    duePresets: "Change the due day",
    dueToday: "Today",
    dueTomorrow: "Tomorrow",
    dueNextWeek: "Next week",
    repeatLabel: "Repeat",
    repeatNone: "Doesn't repeat",
    repeatDaily: "Every day",
    repeatWeekly: "Every week",
    repeatMonthly: "Every month",
    repeatPresets: "Change the repeat"

  // The page's own language, used only to spell the recognised day.

  // The day the last parse resolved to, or null. Riding along with the save.

  // Set by ×: the same line keeps its day hidden until the text changes.

  // The preset that belonged to that draft. A recalled line is not the line the

  // <due-parser>
  // ── Due-phrase parser ──────────────────────────────────────────────────────
  // Self-contained on purpose: the parser probe lifts this block verbatim and

  // Deliberately narrow: only the phrases listed below, only as standalone
  // words, and the first one in the line wins. The typed title is never
  // rewritten — the matched phrase only decides which day rides along.
  // Day maths stays in local parts (`new Date(y, m - 1, d)`) so a DST shift or
  // a month rollover is decided by the calendar, never by an instant.

  var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                   "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var WEEKDAY_ZH = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "日": 0, "天": 0 };
  var WEEKDAY_EN = {
    sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6,

  var WEEKDAY_NAMES = {
    zh: ["周日", "周一", "周二", "周三", "周四", "周五", "周六"],

    en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
  };

  function weekdayName(date) {
    var names = WEEKDAY_NAMES[lang] || WEEKDAY_NAMES.en;

  }

  function pad2(n) {
    return (n < 10 ? "0" : "") + n;
  }

  /** Local calendar day, or null when the parts are not a real day. */
  function localDay(y, m, d) {
    if (!(y >= 2000 && y <= 2100)) return null;
    var date = new Date(y, m - 1, d);
    if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
    return date;
  }

  function todayParts(date) {
    return { y: date.getFullYear(), m: date.getMonth() + 1, d: date.getDate(), dow: date.getDay() };
  }

  function addDays(today, n) {
    var date = new Date(today.y, today.m - 1, today.d + n);
    return { y: date.getFullYear(), m: date.getMonth() + 1, d: date.getDate() };
  }

  /** A month/day with no year: the next occurrence, today included. */
  function nextOccurrence(today, month, day) {
    var base = new Date(today.y, today.m - 1, today.d).getTime();
    // Feb 29 exists in only one year out of four, so walking one year forward
    // would drop the most memorable date there is. The bound is small and
    // finite; the localDay check still owns leap years (2100 is not one).
    for (var y = today.y; y <= today.y + 8; y++) {
      var date = localDay(y, month, day);
      if (date && date.getTime() >= base) return date;
    }
    return null;
  }

  function weekdayFrom(today, target) {
    // Today counts: "Friday" typed on a Friday means today.
    var d = addDays(today, (target - today.dow + 7) % 7);
    return localDay(d.y, d.m, d.d);
  }

  function dueOnOf(date) {
    return pad2(date.getFullYear()) + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  /** A word or a number may not continue into the match from either side. */
  function standalone(text, index, length) {
    var before = index > 0 ? text.charAt(index - 1) : "";
    var after = index + length < text.length ? text.charAt(index + length) : "";
    if (before && /[A-Za-z0-9\/.\-]/.test(before)) return false;
    if (after && /[A-Za-z0-9\/.]/.test(after)) return false;
    return true;
  }

  /**
   * First matching phrase in the text, or null. `today` is a parts object so
   * the caller can pin the clock (the probe script does exactly that).
   */
  function parseDue(text, today) {
    if (typeof text !== "string" || !text) return null;
    var found = [];

    function offer(match, resolve, needsStandalone) {
      if (!match) return;
      if (needsStandalone && !standalone(text, match.index, match[0].length)) return;
      var date = resolve(match);
      if (!date) return;
      found.push({
        index: match.index,
        phrase: match[0],
        dueOn: dueOnOf(date),
        date: date
      });
    }

    // An explicit ISO day is unambiguous, so it is collected first; the M/D
    // rule below must not read "11-05" out of the middle of it.
    var iso = /(\d{4})-(\d{2})-(\d{2})/.exec(text);
    offer(iso, function (m) { return localDay(+m[1], +m[2], +m[3]); }, true);
    var isoEnd = iso ? iso.index + iso[0].length : -1;

    // Chinese: relative days first (longest alternative first, so 大后天 never
    // degrades to 后天), then weekdays, then a month/day.
    offer(/(大后天|后天|明天|今天)/.exec(text), function (m) {
      var d = addDays(today, OFFSET_ZH[m[1]]);
      return localDay(d.y, d.m, d.d);
    }, false);

    offer(/(\d{1,3})\s*天后/.exec(text), function (m) {
      var d = addDays(today, +m[1]);
      return localDay(d.y, d.m, d.d);
    }, true);

    // The lookahead keeps a count from reading as a weekday: 每周三次 is "three
    // times a week", not "every Wednesday", and 周四天 would be a stray case of
    // the same shape. 下周三 still matches, because 次/回/遍/趟 cannot follow it.
    offer(/(下周|周)([一二三四五六日天])(?![次回遍趟号])/.exec(text), function (m) {
      // 上周五 is a day that has already been; pretending it is next week's
      // Friday would put a wrong deadline on a note about the past.
      if (m.index > 0 && text.charAt(m.index - 1) === "上") return null;
      var target = WEEKDAY_ZH[m[2]];
      var delta;
      if (m[1] === "下周") {
        // The X of the next Monday-started week, the everyday reading.
        var toMonday = (1 - today.dow + 7) % 7 || 7;
        delta = toMonday + (target === 0 ? 6 : target - 1);
      } else {
        delta = (target - today.dow + 7) % 7;
      }
      var d = addDays(today, delta);
      return localDay(d.y, d.m, d.d);
    }, false);

    // Bare 下周 / 下星期 / 下礼拜 names the coming Monday-started week, the same
    // day English "next week" does; before this it named no day at all. The
    // weekday form above is offered first, so 下周一 still wins at the same
    // index. A following number is left alone: "下周 5" is someone writing next
    // week's Friday (or the 5th) by hand, and today+7 is neither, so it stays a
    // line with no day rather than one with a wrong day.
    offer(/(下周|下星期|下礼拜)(?!\s*\d)/.exec(text), function () {
      var d = addDays(today, 7);
      return localDay(d.y, d.m, d.d);
    }, false);

    offer(/(\d{1,2})月(\d{1,2})[日号]/.exec(text), function (m) {
      return nextOccurrence(today, +m[1], +m[2]);
    }, true);

    // English: single words and phrases, bounded so "tomorrowland" is not a day.
    offer(/\b(today|tomorrow|tonight)\b/i.exec(text), function (m) {
      var d = addDays(today, m[1].toLowerCase() === "tomorrow" ? 1 : 0);
      return localDay(d.y, d.m, d.d);
    }, false);

    // Full names are words of their own; the three-letter forms are also
    // ordinary English ("buy a sun lamp", "I sat with the client"), so they
    // only count when written the way a date is: capitalised.
    offer(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.exec(text), function (m) {
      // "last Friday" is behind us; a due day cannot point there.
      if (/(?:last|previous|past)\s+$/i.test(text.slice(0, m.index))) return null;
      return weekdayFrom(today, WEEKDAY_EN[m[1].toLowerCase()]);
    }, false);

    offer(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/.exec(text), function (m) {
      if (/(?:last|previous|past)\s+$/i.test(text.slice(0, m.index))) return null;
      return weekdayFrom(today, WEEKDAY_EN[m[1].toLowerCase()]);
    }, false);

    offer(/\bnext\s+week\b/i.exec(text), function () {
      var d = addDays(today, 7);

    offer(/\bin\s+(\d{1,3})\s+days?\b/i.exec(text), function (m) {
      var d = addDays(today, +m[1]);

    // M/D (year optional) and M-D-YYYY. A bare M-D is not a date here: "5-10
    // min" and "2024-2025" are ranges far more often than they are days, and a
    // wrong day rides into the saved task. Nor is a slash date followed by a
    // unit — "2/3 of the budget", "5/8 cup" — a fraction, not a deadline. The
    // scan walks past shapes it cannot use (and past the inside of an ISO day)
    // instead of giving up on the line.
    var MD_UNIT = /^\s*(?:%|percent|mins?\b|minutes?\b|h\b|hrs?\b|hours?\b|days?\b|weeks?\b|wks?\b|months?\b|x\b|times?\b|of\b|cups?\b|people\b|persons?\b|items?\b|pages?\b|chars?\b|words?\b|分|小时|天|周|个月|倍|人|页|字|条|次)/i;

    var md;
    while ((md = mdRe.exec(text)) !== null) {
      if (isoEnd > 0 && md.index < isoEnd && md.index + md[0].length > iso.index) continue;
      if (!standalone(text, md.index, md[0].length)) continue;

      if (!md[4] && MD_UNIT.test(text.slice(md.index + md[0].length))) continue;

        ? localDay(year, +md[1], +md[3])

        phrase: md[0],

    if (!found.length) return null;

  // ── Repeat-cadence scan ────────────────────────────────────────────────────
  // The same narrow discipline as the day scan: only the listed phrases, only
  // as a phrase of their own, and the first one in the line wins. A cadence and
  // a day may both be present; each is collected independently, so "每周五交
  // 周报" gets Friday from the day scan and weekly from here.
  //
  // English "every day" must keep its space: "everyday" is ordinary prose and
  // is never a cadence. "every <weekday>" borrows the day scan's capitalisation

  // counts, while three-letter forms still need a capital ("every Fri" yes,
  // "every fri" no — that is also the word "fri" in ordinary text).
  function parseCadence(text) {
    if (typeof text !== "string" || !text) return null;
    var found = [];

    function offer(re, value, weekdayOf) {
      // A hyphen counts as a word boundary to \b, so "bi-weekly" and
      // "semi-monthly" would otherwise read as bare cadences. A hyphen that
      // follows a letter marks a compound, and the word after it is not a
      // cadence of its own; "daily-ish" keeps its hyphen after the phrase, so
      // it still counts. A rejected match is skipped so a later, genuine
      // phrase in the same line can still win ("bi-weekly, then weekly").
      var scan = new RegExp(re.source, re.flags.indexOf("g") < 0 ? re.flags + "g" : re.flags);
      var match;
      while ((match = scan.exec(text)) !== null) {
        var afterCompoundHyphen = match.index >= 2 &&
          text.charAt(match.index - 1) === "-" &&
          /[A-Za-z]/.test(text.charAt(match.index - 2));
        if (afterCompoundHyphen) continue;
        // A link is one token, and nothing inside it is the user's own words:
        // "review https://example.com/weekly-report" is a task about a URL, not
        // a weekly series. Slashes, a scheme or a leading www. mark the token as
        // a link; the phrase inside it is skipped like a compound's tail.
        var tokenStart = match.index;
        while (tokenStart > 0 && !/\s/.test(text.charAt(tokenStart - 1))) tokenStart -= 1;
        var tokenEnd = match.index + match[0].length;
        while (tokenEnd < text.length && !/\s/.test(text.charAt(tokenEnd))) tokenEnd += 1;
        var token = text.slice(tokenStart, tokenEnd);
        if (token.indexOf("://") >= 0 || /www\./i.test(token) || token.indexOf("/") >= 0) continue;
        found.push({
          index: match.index,
          phrase: match[0],
          repeat: value,
          weekday: typeof weekdayOf === "function" ? weekdayOf(match) : null
        });
        return;
      }
    }

    offer(/\bevery\s+day\b/i, "daily");
    offer(/\bdaily\b/i, "daily");
    offer(/\beach\s+day\b/i, "daily");
    offer(/\bevery\s+week\b/i, "weekly");
    offer(/\bweekly\b/i, "weekly");
    offer(/\bevery\s+month\b/i, "monthly");
    offer(/\bmonthly\b/i, "monthly");

    offer(/\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i, "weekly",
      function (m) { return WEEKDAY_EN[m[1].toLowerCase()]; });
    offer(/\bevery\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/, "weekly",
      function (m) { return WEEKDAY_EN[m[1].toLowerCase()]; });

    // Chinese has no word boundaries; these are bound phrases, so the listed
    // form itself is the bound. The weekday form is offered separately from
    // the bare 每周 so the day it names is remembered even when the day scan
    // has no 周 to hold on to ("每星期五" has no bare 周五 match today).
    // The qualifiers 末 / 底 / 初 / 中 fall outside these cadences, so they get
    // no cadence rather than a wrong one: 周末 names two days, not a weekday a
    // weekly series could repeat on, and 月底 / 月初 / 月中 name a point in the
    // month that a same-day monthly series cannot honour.
    offer(/每天|每日|天天/, "daily");
    offer(/每周(?!末)|每星期(?!末)|每礼拜(?!末)/, "weekly");
    // 每个月 is the same phrase with a measure word; it needs the same guard, or
    // 每个月末 becomes a monthly series that starts today.
    offer(/每月(?!底|初|中)|每个月(?!末|底|初|中)/, "monthly");
    // A following count is not a weekday: 每周三次 is "three times a week".
    offer(/每(?:周|星期|礼拜)(?:周|星期|礼拜)?([一二三四五六日天])(?![次回遍趟号])/, "weekly",
      function (m) { return WEEKDAY_ZH[m[1]]; });

    offer(/매일/, "daily");
    offer(/매주/, "weekly");
    offer(/매월/, "monthly");

    if (!found.length) return null;
    // Earliest phrase wins; at the same index the longer phrase wins so
    // "每星期五" is remembered as itself rather than as the bare 每星期.
    found.sort(function (a, b) {
      return a.index - b.index || b.phrase.length - a.phrase.length;
    });
    return found[0];
  }

  /**
   * Both recognitions from one read of the line. The typed title is never
   * rewritten; this only says what will ride along with it.
   */
  function parseCapture(text, today) {
    var cadence = parseCadence(text);
    return {
      due: parseDue(text, today),
      repeat: cadence ? cadence.repeat : null,
      repeatPhrase: cadence ? cadence.phrase : null,
      weekday: cadence ? cadence.weekday : null

  }

  /**
   * The day a repeating task starts on. Daily and monthly land today; weekly
   * lands on the weekday the phrase named (today counts when it is that
   * weekday), otherwise today. An explicit day in the line outranks anything
   * the cadence would invent — except that a weekly cadence naming a weekday
   * starts on the first such weekday on or after the explicit day: "next week,
   * every Friday" begins on the coming Friday, not on next week's Saturday.
   */
  function cadenceDay(parsed, today) {
    if (!parsed) return null;
    var weeklyWeekday = parsed.repeat === "weekly" &&
      parsed.weekday !== null && parsed.weekday !== undefined;
    if (parsed.due) {
      // The explicit day already being that weekday makes it the first
      // occurrence, so "每周五" typed on a Friday starts today.
      if (weeklyWeekday) return weekdayFrom(todayParts(parsed.due.date), parsed.weekday);
      return parsed.due.date;
    }
    if (!parsed.repeat) return null;
    if (weeklyWeekday) return weekdayFrom(today, parsed.weekday);
    return localDay(today.y, today.m, today.d);
  }
  // </due-parser>

  /** The day as the bar spells it: 11月1日 / Nov 1 / 11월 1일. */
  function formatChipDate(date, today) {
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();
    if (lang === "zh") return y !== today.y ? y + "年" + m + "月" + d + "日" : m + "月" + d + "日";
    if (lang === "ko") return y !== today.y ? y + "년 " + m + "월 " + d + "일" : m + "월 " + d + "일";
    return y !== today.y ? MONTHS_EN[m - 1] + " " + d + ", " + y : MONTHS_EN[m - 1] + " " + d;
  }

  /**
   * Show the day the line names, or the day a cadence lands on when the line
   * named none. Nothing here touches the input: no value rewrite, no
   * selection, no focus.
   */
  function renderDue(parsed, today) {
    var match = parsed.due;
    // A different recognised phrase replaces the chosen preset: the line now
    // names a day of its own. The phrase that was already there when the
    // preset was chosen does not, or one more keystroke would undo the choice.
    if (chosenDue && match &&
        (match.phrase !== chosenDue.fromPhrase || match.dueOn !== chosenDue.fromDueOn)) {
      chosenDue = null;
    }
    due = null;
    if (!dueDismissed) {
      if (chosenDue) {
        // The phrase text follows the choice, never the stale line phrase.
        due = { phrase: chosenDue.label, dueOn: chosenDue.dueOn, date: chosenDue.date };
      } else if (match) {
        // The cadence can move the day the series starts on (weekly + a named
        // weekday), so the anchored day outranks the plain day phrase. When it
        // moves the day, the typed phrase would contradict the date beside it —
        // "tomorrow · Nov 6" with tomorrow being Thursday — so the chip names
        // the weekday it will actually use. The input text is never touched.
        var anchored = cadenceDay(parsed, today);
        var anchoredDay = anchored ? dueOnOf(anchored) : "";
        due = anchored
          ? {
              phrase: anchoredDay === dueOnOf(match.date) ? match.phrase : weekdayName(anchored),
              dueOn: anchoredDay,
              date: anchored
            }
          : match;
      } else {
        // A cadence with no day still needs a day to appear on the desk. Its
        // phrase is empty: the cadence chip beside this one already says why.
        var derived = cadenceDay(parsed, today);
        if (derived) due = { phrase: "", dueOn: dueOnOf(derived), date: derived };
      }
    }
    if (!due) {
      dueEl.hidden = true;
      dueEl.removeAttribute("aria-label");
      // There is nothing to offer presets for once the chip is gone.
      hidePresets();
      return;
    }
    duePhrase.textContent = due.phrase;
    dueSep.hidden = !due.phrase;
    dueDate.textContent = formatChipDate(due.date, today);
    dueEl.setAttribute("aria-label", labels.dueLabel + ": " +
      (due.phrase ? due.phrase + " · " + dueDate.textContent : dueDate.textContent));
    dueEl.hidden = false;
  }

  /** The chip's own name for a cadence value. */
  function repeatLabelFor(value) {
    if (value === "daily") return labels.repeatDaily;
    if (value === "weekly") return labels.repeatWeekly;
    if (value === "monthly") return labels.repeatMonthly;
    return labels.repeatNone;
  }

  /**
   * Show the cadence in force. The line outranks the manual pick exactly as it
   * does for the day: a different cadence phrase in the line replaces the

        event.preventDefault();
        var repeatNext = event.key === "ArrowRight"
          ? (repeatIndex < 0 ? 0 : (repeatIndex + 1) % repeatPresetButtons.length)
          : (repeatIndex < 0 ? repeatPresetButtons.length - 1
            : (repeatIndex + repeatPresetButtons.length - 1) % repeatPresetButtons.length);
        try { repeatPresetButtons[repeatNext].el.focus(); } catch (err) { /* window may be going away */ }
        return;
      }
    }

    if (duePresets.hidden) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    // ←/→ step through the three days while the strip owns the keyboard. ↑/↓
    // are deliberately left alone: the input keeps its history walk. If the
    // text field has focus, the arrows remain ordinary caret movement.
    var active = document.activeElement;
    var inside = active === dueDate;
    var index = -1;
    for (var i = 0; i < presetButtons.length; i++) {
      if (presetButtons[i].el === active) {
        inside = true;
        index = i;
      }
    }
    if (!inside) return;
    event.preventDefault();
    var next = event.key === "ArrowRight"
      ? (index < 0 ? 0 : (index + 1) % presetButtons.length)
      : (index < 0 ? presetButtons.length - 1
        : (index + presetButtons.length - 1) % presetButtons.length);
    try { presetButtons[next].el.focus(); } catch (err) { /* window may be going away */ }
  });

  // Discoverability only: the arrows walk the saved captures. A bare glyph
  // rather than a new string, so this page adds nothing to the i18n table.
  (function addRecallGlyph() {
    var keys = document.createElement("span");
    keys.textContent = "↑↓";
    keys.setAttribute("aria-hidden", "true");
    keys.style.opacity = "0.72";
    saveHint.parentNode.appendChild(keys);
  })();

  if (api) {
    api.onShow(show);
    api.onSaved(applyStaySaved);
    api.onError(function (data) {
      saving = false;
      // A refused write ends the stay cycle: the field still holds the line the
      // user is writing now, and nothing is filed behind their back.
      pendingStayText = "";
      queuedStay = false;
      showError(data && data.message, data && data.kind);
      try { input.focus(); } catch (err) { /* not focusable */ }
    });
    api.onFocus(function () {
      try { input.focus(); } catch (err) { /* not focusable */ }
    });
  } else {
    // Loaded outside Electron (screenshot harness): show the finished surface.
    show({ lang: "en", theme: "sao", labels: labels });
  }
})();
</script>
