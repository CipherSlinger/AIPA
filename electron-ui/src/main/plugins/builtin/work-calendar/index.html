<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作日历 - AIPA 插件</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
        </span>
        <span class="brand-name">工作日历</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-view="calendar">日历</button>
        <button class="tab" data-view="tasks">任务</button>
        <button class="tab" data-view="reminders">提醒</button>
        <button class="tab" data-view="sources">工作源</button>
        <button class="tab" data-view="reports">报告</button>
        <button class="tab" data-view="persondays">人天</button>
        <button class="tab" data-view="settings">设置</button>
      </nav>
    </header>
    <main class="main" id="main">
      <div class="loading-page"><span class="spinner"></span>加载中...</div>
    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>

  <script src="js/bridge.js"></script>
  <script src="js/util.js"></script>
  <script src="js/cron.js"></script>
  <script src="js/store.js"></script>
  <script src="js/generation.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/reminders.js"></script>
  <script src="js/views/sources.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/persondays.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
