<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便签笔记 - AIPA 原生插件</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --sidebar-hover: #f1f5f9;
      --sidebar-active: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --border: #e2e8f0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --code-bg: #f1f5f9;
      /* Reading measure for the note body: the text column stays this wide and
         the extra pane width becomes margin. --gutter is the inset inside the
         column that also aligns the toolbar title with the first character. */
      --measure: 760px;
      --gutter: 26px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --sidebar-hover: #24334a;
      --sidebar-active: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --border: #334155;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --danger: #f87171;
      --code-bg: #0b1120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    .app { display: flex; height: 100%; width: 100%; }

    /* Left Sidebar */
    .sidebar { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--sidebar-bg); display: flex; flex-direction: column; height: 100%; }
    .sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .btn-new { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-new:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .search-wrap { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text); outline: none; }
    .search-input:focus { border-color: var(--accent); }

    .cat-bar { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-chip { font-size: 11px; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s; user-select: none; }
    .cat-chip:hover { color: var(--text); border-color: var(--accent); }
    .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

    .notes-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .note-card { padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 4px; }
    .note-card:hover { background: var(--sidebar-hover); }
    .note-card.active { background: var(--sidebar-active); border-color: var(--border); border-left: 3px solid var(--accent); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card-excerpt { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 4px; }
    .cat-badge { padding: 1px 5px; border-radius: 4px; background: rgba(99,102,241,0.1); color: var(--accent); font-weight: 600; font-size: 9px; }

    /* Right Main Editor */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg); overflow: hidden; container-type: inline-size; }
    .toolbar { height: 50px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; flex-shrink: 0; }
    .toolbar-inner { width: 100%; max-width: calc(var(--measure) + var(--gutter) * 2); padding: 0 var(--gutter); display: flex; align-items: center; gap: 10px; min-width: 0; }
    /* The title gets a bounded box so the action cluster sits at the right edge
       of the content measure instead of being pushed to the far edge of the
       window by a short title. */
    .title-input { font-size: 15px; font-weight: 700; color: var(--text); border: none; outline: none; background: transparent; padding: 0; flex: 0 1 360px; min-width: 90px; }
    .tools { display: flex; align-items: center; gap: 5px; margin-left: auto; flex-shrink: 0; }
    .btn-action { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; }
    .btn-action:hover { background: var(--sidebar-hover); border-color: var(--accent); color: var(--accent); }
    .btn-ai { background: linear-gradient(135deg, rgba(99,102,241,0.85), rgba(139,92,246,0.85)); color: #fff; border: none; font-weight: 600; }
    .btn-ai:hover { opacity: 0.95; transform: translateY(-1px); color: #fff; }
    .cat-select { font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    .mode-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .mode-btn { background: transparent; border: none; padding: 4px 8px; font-size: 11px; color: var(--text-muted); cursor: pointer; }
    .mode-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Editor: the textarea stays full-bleed (so its scrollbar hugs the pane)
       while its inline padding centres the text column on the measure. */
    .editor-text { width: 100%; height: 100%; border: none; outline: none; resize: none; background: transparent; color: var(--text);
      padding: 26px max(var(--gutter), calc((100% - var(--measure)) / 2)) 48px;
      font-size: 13px; line-height: 1.72; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Consolas, monospace; }

    /* Preview: #note-preview is the scroll container, .preview-inner the centred
       column, so the scrollbar stays at the pane edge rather than mid-air. */
    .preview-box { width: 100%; height: 100%; overflow-y: auto; color: var(--text); }
    .preview-inner { max-width: calc(var(--measure) + var(--gutter) * 2); margin: 0 auto; padding: 26px var(--gutter) 48px;
      font-size: 13px; line-height: 1.72; overflow-wrap: break-word; }
    .preview-inner > :first-child { margin-top: 0; }
    .preview-inner > :last-child { margin-bottom: 0; }

    .preview-inner p { margin: 0 0 14px; }
    .preview-inner h1, .preview-inner h2, .preview-inner h3, .preview-inner h4, .preview-inner h5, .preview-inner h6 { font-weight: 650; line-height: 1.35; color: var(--text); }
    .preview-inner h1 { font-size: 20px; margin: 34px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .preview-inner h2 { font-size: 16px; margin: 28px 0 10px; }
    .preview-inner h3 { font-size: 14px; margin: 24px 0 8px; }
    .preview-inner h4 { font-size: 13px; margin: 20px 0 6px; }
    .preview-inner h5, .preview-inner h6 { font-size: 12.5px; margin: 18px 0 6px; color: var(--text-muted); }
    .preview-inner strong { font-weight: 650; }
    .preview-inner ul, .preview-inner ol { margin: 0 0 14px; padding-left: 22px; }
    .preview-inner li { margin: 0 0 5px; padding-left: 2px; }
    .preview-inner li:last-child { margin-bottom: 0; }
    .preview-inner li::marker { color: var(--text-faint); }
    .preview-inner ul.task-list { list-style: none; padding-left: 2px; }
    .preview-inner li.task { display: flex; align-items: flex-start; gap: 8px; }
    .preview-inner li.task input { margin-top: 4px; flex-shrink: 0; accent-color: var(--accent); }
    .preview-inner li.task .done { color: var(--text-muted); text-decoration: line-through; }
    .preview-inner blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); color: var(--text-muted); }
    .preview-inner li > blockquote { margin: 5px 0 3px; }
    .preview-inner code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-family: Consolas, "SF Mono", monospace; font-size: 12px; }
    .preview-inner pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0 0 14px; line-height: 1.6; }
    .preview-inner pre code { background: transparent; padding: 0; font-size: 12px; }
    .preview-inner hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .preview-empty { color: var(--text-faint); font-style: italic; }

    /* Narrow panes (the app allows an 800px window): wrap the header instead of
       clipping any action. */
    @container (max-width: 600px) {
      .toolbar { height: auto; min-height: 50px; }
      .toolbar-inner { flex-wrap: wrap; padding-block: 8px; row-gap: 4px; }
      .title-input { flex: 1 1 100%; max-width: none; }
    }

    .statusbar { height: 26px; border-top: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--text-faint); flex-shrink: 0; background: var(--sidebar-bg); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span data-i18n="📝 Quick Notes">📝 便签笔记</span>
        </div>
        <button class="btn-new" onclick="createNewNote()" data-i18n="+ New">+ 新建</button>
      </div>

      <div class="search-wrap">
        <input class="search-input" id="search-input" placeholder="搜索笔记标题或内容..." data-i18n-ph="Search titles or content..." oninput="onSearchChange()">
      </div>

      <div class="cat-bar" id="cat-bar">
        <span class="cat-chip active" onclick="setCategoryFilter('all')" data-i18n="All">全部</span>
        <span class="cat-chip" onclick="setCategoryFilter('pinned')" data-i18n="📌 Pinned">📌 置顶</span>
        <span class="cat-chip" onclick="setCategoryFilter('work')" data-i18n="💼 Work">💼 工作</span>
        <span class="cat-chip" onclick="setCategoryFilter('ideas')" data-i18n="💡 Ideas">💡 灵感</span>
        <span class="cat-chip" onclick="setCategoryFilter('study')" data-i18n="📚 Study">📚 学习</span>
        <span class="cat-chip" onclick="setCategoryFilter('prompts')" data-i18n="🤖 Prompts">🤖 提示词</span>
        <span class="cat-chip" onclick="setCategoryFilter('todo')" data-i18n="✅ To-do">✅ 待办</span>
      </div>

      <div class="notes-list" id="notes-list"></div>
    </div>

    <!-- Main Editor -->
    <div class="main">
      <div class="toolbar">
        <div class="toolbar-inner">
          <input class="title-input" id="note-title" placeholder="输入笔记标题..." data-i18n-ph="Note title..." oninput="onTitleChange()">
          <div class="tools">
            <select class="cat-select" id="note-cat" onchange="onCatChange()">
              <option value="work" data-i18n="💼 Work">💼 工作</option>
              <option value="ideas" data-i18n="💡 Ideas">💡 灵感</option>
              <option value="study" data-i18n="📚 Study">📚 学习</option>
              <option value="prompts" data-i18n="🤖 Prompts">🤖 提示词</option>
              <option value="todo" data-i18n="✅ To-do">✅ 待办</option>
            </select>
            <button class="btn-action" id="btn-pin" onclick="togglePin()" title="置顶" data-i18n-title="Pin">📌</button>

            <div class="mode-switch">
              <button class="mode-btn active" id="btn-edit-mode" onclick="setMode('edit')" data-i18n="Edit">编辑</button>
              <button class="mode-btn" id="btn-preview-mode" onclick="setMode('preview')" data-i18n="Preview">预览</button>
            </div>

            <button class="btn-action btn-ai" onclick="sendToAI()" title="发送给 AI 对话分析" data-i18n-title="Send to AI chat" data-i18n="🤖 Send to AI">🤖 发送给 AI</button>
            <button class="btn-action" onclick="copyContent()" title="复制正文" data-i18n-title="Copy content" data-i18n="📋 Copy">📋 复制</button>
            <button class="btn-action" onclick="deleteCurrentNote()" style="color:var(--danger)" title="删除此笔记" data-i18n-title="Delete note">🗑️</button>
          </div>
        </div>
      </div>

      <div class="content-area">
        <textarea class="editor-text" id="note-body" placeholder="在此编写 Markdown 笔记内容..." data-i18n-ph="Write your note in Markdown..." oninput="onContentChange()"></textarea>
        <div class="preview-box" id="note-preview" style="display:none;"></div>
      </div>

      <div class="statusbar">
        <span id="stats-text" data-i18n="0 notes · 0 characters">共 0 篇笔记 · 0 字</span>
        <span id="save-status" data-i18n="● Saved">● 已自动保存</span>
      </div>
    </div>
  </div>

  <script>
    // Language: host passes ?lang=en|zh-CN; outside AIPA fall back to the browser language
    const IS_EN = (function () {
      try {
        const q = new URLSearchParams(location.search).get('lang');
        if (q) return q.indexOf('zh') !== 0;
      } catch (e) {}
      return (navigator.language || 'zh').toLowerCase().indexOf('zh') !== 0;
    })();
    function L(zh, en) { return IS_EN ? en : zh; }
    if (IS_EN) {
      document.documentElement.lang = 'en';
      document.title = 'Quick Notes - AIPA Plugin';
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = el.getAttribute('data-i18n'); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = el.getAttribute('data-i18n-ph'); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = el.getAttribute('data-i18n-title'); });
    }

    // AIPA Client SDK Bridge
    window.AIPA = {
      sendPrompt: function(prompt) {
        window.parent.postMessage({ type: 'aipa:sendPrompt', payload: { prompt: prompt } }, '*');
      },
      toast: function(type, message) {
        window.parent.postMessage({ type: 'aipa:toast', payload: { type: type, message: message } }, '*');
      },
      storage: {
        set: function(key, val) {
          localStorage.setItem('aipa_notes_' + key, JSON.stringify(val));
          window.parent.postMessage({ type: 'aipa:storage:set', payload: { key: key, value: val } }, '*');
        },
        get: function(key) {
          const v = localStorage.getItem('aipa_notes_' + key);
          return v ? JSON.parse(v) : null;
        }
      }
    };

    const DEFAULT_NOTES = [
      {
        id: 'note-starter-1',
        title: '💡 欢迎使用便签笔记原生插件',
        content: '# 欢迎体验 AIPA 免编译原生插件！\n\n这是 AIPA **热插拔插件生态**的官方示例。本插件完全使用原生 **HTML5 + CSS3 + Vanilla JavaScript** 构建，无需任何打包构建链，修改保存后即改即生效！\n\n### 核心特性：\n- 📝 **Markdown 即写即看**：支持标题、粗体、代码块、引用与待办清单；\n- 🤖 **一键与 AI 对话联动**：点击右上角「发送给 AI」，把当前笔记内容发送给智能助手进行扩展、润色或代码审查；\n- 📌 **多维度分类与置顶**：工作、灵感、学习、提示词、待办多分类聚合；\n- 💾 **本地安全持久化**：笔记数据自动保存在本地，跨会话永不丢失。',
        category: 'ideas',
        pinned: true,
        updatedAt: Date.now() - 1000 * 60 * 10
      },
      {
        id: 'note-starter-2',
        title: '🤖 常用 AI 高效提示词收集',
        content: '### 精选常用 AI 指令\n\n1. **代码审查 (Code Review)**：\n> 请审查以下代码逻辑，重点关注边界溢出、异常处理、资源未释放以及并发安全性。\n\n2. **重构提炼**：\n> 在保证现有单元行为完全一致的前提下，重构以下函数以降低复杂度并提高可读性。\n\n3. **架构分析**：\n> 分析当前模块的数据流向，指出潜在的单点瓶颈并给出优化方案。',
        category: 'prompts',
        pinned: false,
        updatedAt: Date.now() - 1000 * 60 * 60
      },
      {
        id: 'note-starter-3',
        title: '📋 本周任务备忘清单',
        content: '### 本周核心事项：\n\n- [x] 体验 AIPA 免编译热插拔插件中心\n- [x] 将便签笔记接入插件体系\n- [ ] 为团队编写专属微工具插件\n- [ ] 探索 Canvas 工作流编排能力',
        category: 'todo',
        pinned: false,
        updatedAt: Date.now() - 1000 * 60 * 120
      }
    ];

    const DEFAULT_NOTES_EN = [
      {
        id: 'note-starter-1',
        title: '💡 Welcome to Quick Notes',
        content: '# Welcome to AIPA zero-build plugins!\n\nThis is the official example of the AIPA **hot-pluggable plugin ecosystem**. It is built with plain **HTML5 + CSS3 + vanilla JavaScript** — no build chain; save a change and it takes effect immediately.\n\n### Highlights\n- 📝 **Markdown as you type**: headings, bold, code blocks, quotes and checklists;\n- 🤖 **One click to AI chat**: use "Send to AI" to have the assistant expand, polish or review the current note;\n- 📌 **Categories and pinning**: Work, Ideas, Study, Prompts and To-do;\n- 💾 **Saved locally**: notes are saved automatically and persist across sessions.',
        category: 'ideas',
        pinned: true,
        updatedAt: Date.now() - 1000 * 60 * 10
      },
      {
        id: 'note-starter-2',
        title: '🤖 Handy AI prompts',
        content: '### Useful prompts\n\n1. **Code review**:\n> Review the logic below, focusing on overflow at boundaries, error handling, unreleased resources and concurrency safety.\n\n2. **Refactor**:\n> Refactor this function to reduce complexity and improve readability while keeping its behaviour identical.\n\n3. **Architecture**:\n> Analyse how data flows through this module, point out bottlenecks and suggest improvements.',
        category: 'prompts',
        pinned: false,
        updatedAt: Date.now() - 1000 * 60 * 60
      },
      {
        id: 'note-starter-3',
        title: "📋 This week's checklist",
        content: '### This week\n\n- [x] Try the AIPA plugin hub\n- [x] Add Quick Notes to the plugin system\n- [ ] Build a custom plugin for the team\n- [ ] Explore the Canvas workflow editor',
        category: 'todo',
        pinned: false,
        updatedAt: Date.now() - 1000 * 60 * 120
      }
    ];

    let notes = [];
    let activeId = null;
    let activeCatFilter = 'all';
    let currentMode = 'edit';
    let saveTimeout = null;

    function init() {
      try {
        const saved = localStorage.getItem('aipa_notes_list');
        if (saved) {
          notes = JSON.parse(saved);
        }
      } catch (e) {}

      // Listen for theme
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'aipa:theme') {
          document.documentElement.setAttribute('data-theme', e.data.theme);
        }
        // One-time migration: plugins now run on their own aipa-plugin: origin,
        // so the localStorage they used before that change is gone. Notes were
        // mirrored to the host on every save — recover them, then keep using
        // local storage as before.
        if (e.data && e.data.type === 'aipa:storage:response' && e.data.requestId === 'migrate-notes') {
          if (!notes || notes.length === 0) {
            if (Array.isArray(e.data.value) && e.data.value.length > 0) {
              notes = e.data.value;
              persist();
            }
            start();
          }
        }
      });

      if (!notes || notes.length === 0) {
        window.parent.postMessage({ type: 'aipa:storage:get', requestId: 'migrate-notes', payload: { key: 'notes_list' } }, '*');
        // Host may be unavailable (opened outside AIPA): seed defaults shortly.
        setTimeout(function () { if (!notes || notes.length === 0) start(); }, 300);
      } else {
        start();
      }

      // Report ready
      if (window.parent) {
        window.parent.postMessage({ type: 'aipa:ready' }, '*');
      }
    }

    function start() {
      if (!notes || notes.length === 0) {
        notes = IS_EN ? DEFAULT_NOTES_EN : DEFAULT_NOTES;
        persist();
      }
      activeId = notes[0] ? notes[0].id : null;
      renderNotesList();
      loadActiveNote();
    }

    function persist() {
      localStorage.setItem('aipa_notes_list', JSON.stringify(notes));
      if (window.AIPA && window.AIPA.storage) {
        window.AIPA.storage.set('notes_list', notes);
      }
      updateSaveIndicator(L('● 已自动保存', '● Saved'));
    }

    function updateSaveIndicator(text) {
      const el = document.getElementById('save-status');
      if (el) el.innerText = text;
    }

    function getActiveNote() {
      return notes.find(n => n.id === activeId) || null;
    }

    function renderNotesList() {
      const listEl = document.getElementById('notes-list');
      const search = (document.getElementById('search-input').value || '').trim().toLowerCase();

      let filtered = notes.filter(n => {
        if (activeCatFilter === 'pinned') return n.pinned;
        if (activeCatFilter !== 'all' && n.category !== activeCatFilter) return false;
        if (!search) return true;
        return (n.title || '').toLowerCase().includes(search) || (n.content || '').toLowerCase().includes(search);
      });

      // Sort: pinned first, then updatedAt desc
      filtered.sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });

      listEl.innerHTML = '';
      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="padding:24px 12px; text-align:center; color:var(--text-faint); font-size:12px;">' + L('暂无相关笔记', 'No matching notes') + '</div>';
        return;
      }

      filtered.forEach(n => {
        const item = document.createElement('div');
        item.className = 'note-card' + (n.id === activeId ? ' active' : '');
        item.onclick = () => selectNote(n.id);

        const timeStr = formatRelativeTime(n.updatedAt);
        const excerpt = (n.content || '').replace(/[#*`~>]/g, '').trim() || L('无内容...', 'Empty...');
        const catLabel = getCatLabel(n.category);

        item.innerHTML =
          '<div class="card-top">' +
            '<span class="card-title">' + (n.pinned ? '📌 ' : '') + escapeHtml(n.title || L('无标题笔记', 'Untitled note')) + '</span>' +
          '</div>' +
          '<div class="card-excerpt">' + escapeHtml(excerpt) + '</div>' +
          '<div class="card-footer">' +
            '<span class="cat-badge">' + catLabel + '</span>' +
            '<span>' + timeStr + '</span>' +
          '</div>';
        listEl.appendChild(item);
      });

      updateStats();
    }

    function selectNote(id) {
      activeId = id;
      loadActiveNote();
      renderNotesList();
    }

    function loadActiveNote() {
      const note = getActiveNote();
      const titleInput = document.getElementById('note-title');
      const bodyInput = document.getElementById('note-body');
      const catSelect = document.getElementById('note-cat');
      const pinBtn = document.getElementById('btn-pin');

      if (!note) {
        titleInput.value = '';
        bodyInput.value = '';
        titleInput.disabled = true;
        bodyInput.disabled = true;
        return;
      }

      titleInput.disabled = false;
      bodyInput.disabled = false;
      titleInput.value = note.title || '';
      bodyInput.value = note.content || '';
      catSelect.value = note.category || 'work';
      pinBtn.style.opacity = note.pinned ? '1' : '0.4';

      if (currentMode === 'preview') {
        renderPreview();
      }
      updateStats();
    }

    function onTitleChange() {
      const note = getActiveNote();
      if (!note) return;
      note.title = document.getElementById('note-title').value;
      note.updatedAt = Date.now();
      scheduleSave();
      renderNotesList();
    }

    function onContentChange() {
      const note = getActiveNote();
      if (!note) return;
      note.content = document.getElementById('note-body').value;
      note.updatedAt = Date.now();
      scheduleSave();
      updateStats();
    }

    function onCatChange() {
      const note = getActiveNote();
      if (!note) return;
      note.category = document.getElementById('note-cat').value;
      note.updatedAt = Date.now();
      persist();
      renderNotesList();
    }

    function togglePin() {
      const note = getActiveNote();
      if (!note) return;
      note.pinned = !note.pinned;
      note.updatedAt = Date.now();
      document.getElementById('btn-pin').style.opacity = note.pinned ? '1' : '0.4';
      persist();
      renderNotesList();
      window.AIPA.toast('info', note.pinned ? L('已置顶该笔记', 'Note pinned') : L('已取消置顶', 'Note unpinned'));
    }

    function scheduleSave() {
      updateSaveIndicator(L('● 保存中...', '● Saving...'));
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        persist();
      }, 400);
    }

    function createNewNote() {
      const newNote = {
        id: 'note-' + Date.now(),
        title: L('新笔记 ', 'New note ') + new Date().toLocaleDateString(),
        content: '',
        category: activeCatFilter !== 'all' && activeCatFilter !== 'pinned' ? activeCatFilter : 'work',
        pinned: false,
        updatedAt: Date.now()
      };
      notes.unshift(newNote);
      activeId = newNote.id;
      persist();
      renderNotesList();
      loadActiveNote();
      document.getElementById('note-title').focus();
      window.AIPA.toast('success', L('已创建新笔记', 'Note created'));
    }

    function deleteCurrentNote() {
      const note = getActiveNote();
      if (!note) return;
      if (!confirm(L('确定要删除笔记「', 'Delete note "') + (note.title || L('无标题', 'Untitled')) + L('」吗？', '"?'))) return;
      notes = notes.filter(n => n.id !== activeId);
      activeId = notes[0] ? notes[0].id : null;
      persist();
      renderNotesList();
      loadActiveNote();
      window.AIPA.toast('info', L('笔记已删除', 'Note deleted'));
    }

    function setCategoryFilter(cat) {
      activeCatFilter = cat;
      const chips = document.querySelectorAll('.cat-chip');
      chips.forEach(c => c.classList.remove('active'));
      const activeChip = Array.from(chips).find(c => (c.getAttribute('onclick') || '').indexOf("'" + cat + "'") !== -1);
      if (activeChip) activeChip.classList.add('active');
      renderNotesList();
    }

    function onSearchChange() {
      renderNotesList();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-edit-mode').classList.toggle('active', mode === 'edit');
      document.getElementById('btn-preview-mode').classList.toggle('active', mode === 'preview');

      const editEl = document.getElementById('note-body');
      const prevEl = document.getElementById('note-preview');

      if (mode === 'preview') {
        editEl.style.display = 'none';
        prevEl.style.display = 'block';
        renderPreview();
      } else {
        editEl.style.display = 'block';
        prevEl.style.display = 'none';
      }
    }

    function renderPreview() {
      const note = getActiveNote();
      const prevEl = document.getElementById('note-preview');
      if (!note || !note.content.trim()) {
        prevEl.innerHTML = '<div class="preview-inner preview-empty">' + L('无预览内容', 'Nothing to preview') + '</div>';
        return;
      }
      prevEl.innerHTML = '<div class="preview-inner">' + parseMarkdown(note.content) + '</div>';
      prevEl.scrollTop = 0;
    }

    // Inline spans: applied to already-escaped text. Inline code is stashed
    // first so `**x**` inside a code span stays literal.
    function renderInline(text) {
      const codes = [];
      let html = text.replace(/`([^`]+)`/g, function (_, code) {
        codes.push('<code>' + code + '</code>');
        return '\u0000' + (codes.length - 1) + '\u0000';
      });
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      return html.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[+i]; });
    }

    // Block parser. The old version escaped the whole document before matching,
    // which turned `>` into `&gt;` so blockquotes never matched; it also emitted
    // bare <li> without a list, ignored ordered lists, and left paragraphs
    // unwrapped, so no vertical rhythm was possible.
    function parseMarkdown(md) {
      const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
      let html = '';
      let para = [];
      let quote = [];
      let list = null; // { tag: 'ul' | 'ol', items: [], task: boolean }
      let i = 0;

      const inline = (s) => renderInline(escapeHtml(s));
      const isItem = (s) => /^\s*(?:[-*+]\s+(?:\[[ xX]\]\s+)?|\d+[.)]\s+)/.test(s);

      function flushPara() {
        if (!para.length) return;
        html += '<p>' + para.map(inline).join('<br>') + '</p>';
        para = [];
      }
      function flushQuote() {
        if (!quote.length) return;
        html += '<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>';
        quote = [];
      }
      function flushList() {
        if (!list) return;
        const cls = list.tag === 'ul' && list.task ? ' class="task-list"' : '';
        html += '<' + list.tag + cls + '>' + list.items.join('') + '</' + list.tag + '>';
        list = null;
      }
      function flushAll() { flushPara(); flushList(); flushQuote(); }

      while (i < lines.length) {
        const line = lines[i];

        // Fenced code block
        if (/^\s*```/.test(line)) {
          flushAll();
          const code = [];
          i++;
          while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
          i++;
          html += '<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>';
          continue;
        }

        // Blank line ends a paragraph or quote. A list stays open when the next
        // non-blank line is another item, so a blank line between items does not
        // restart the numbering.
        if (!line.trim()) {
          flushPara(); flushQuote();
          let next = '';
          for (let k = i + 1; k < lines.length; k++) { if (lines[k].trim()) { next = lines[k]; break; } }
          if (!(list && isItem(next))) flushList();
          i++;
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          flushAll();
          const level = heading[1].length;
          html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
          i++;
          continue;
        }

        if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushAll(); html += '<hr>'; i++; continue; }

        const quoted = line.match(/^>\s?(.*)$/);
        if (quoted) {
          // A quote directly under a list row belongs to that row (as in the
          // bundled prompts note), not to a document-level blockquote.
          if (list && list.inItem) {
            const last = list.items.length - 1;
            const item = list.items[last];
            if (/<\/blockquote><\/li>$/.test(item)) {
              list.items[last] = item.replace(/<\/blockquote><\/li>$/, '<br>' + inline(quoted[1]) + '</blockquote></li>');
            } else {
              list.items[last] = item.replace(/<\/li>$/, '<blockquote>' + inline(quoted[1]) + '</blockquote></li>');
            }
            i++;
            continue;
          }
          flushPara(); flushList(); quote.push(quoted[1]); i++; continue;
        }

        const task = line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/);
        const bullet = task ? null : line.match(/^\s*[-*+]\s+(.*)$/);
        const ordered = (task || bullet) ? null : line.match(/^\s*\d+[.)]\s+(.*)$/);
        if (task || bullet || ordered) {
          flushPara(); flushQuote();
          const tag = ordered ? 'ol' : 'ul';
          if (list && list.tag !== tag) flushList();
          if (!list) list = { tag: tag, items: [], task: false, inItem: false };
          list.inItem = true;
          if (task) {
            list.task = true;
            const checked = task[1].toLowerCase() === 'x';
            list.items.push('<li class="task"><input type="checkbox" disabled' + (checked ? ' checked' : '') +
              '><span' + (checked ? ' class="done"' : '') + '>' + inline(task[2]) + '</span></li>');
          } else {
            list.items.push('<li>' + inline(bullet ? bullet[1] : ordered[1]) + '</li>');
          }
          i++;
          continue;
        }

        flushList(); flushQuote();
        para.push(line);
        i++;
      }
      flushAll();
      return html;
    }

    function sendToAI() {
      const note = getActiveNote();
      if (!note || !note.content.trim()) {
        window.AIPA.toast('warn', L('笔记内容为空，无法发送给 AI', 'The note is empty, nothing to send to AI'));
        return;
      }
      const prompt = L('【便签笔记 · ', '[Quick Notes · ') + (note.title || L('无标题', 'Untitled')) + L('】：\n\n', ']:\n\n') + note.content + L('\n\n请针对以上笔记内容进行分析、润色或按要求处理。', '\n\nPlease analyse, polish or process the note above as needed.');
      window.AIPA.sendPrompt(prompt);
      window.AIPA.toast('success', L('已将笔记发送至 AI 智能助手！', 'Note sent to the AI assistant!'));
    }

    function copyContent() {
      const note = getActiveNote();
      if (!note || !note.content) return;
      navigator.clipboard.writeText(note.content).then(() => {
        window.AIPA.toast('success', L('已复制笔记正文到剪贴板', 'Note content copied to clipboard'));
      });
    }

    function updateStats() {
      const note = getActiveNote();
      const count = (note && note.content) ? note.content.length : 0;
      document.getElementById('stats-text').innerText = L('共 ' + notes.length + ' 篇笔记 · 当前 ' + count + ' 字', notes.length + ' notes · ' + count + ' characters');
    }

    function getCatLabel(c) {
      const map = IS_EN
        ? { work: '💼 Work', ideas: '💡 Ideas', study: '📚 Study', prompts: '🤖 Prompts', todo: '✅ To-do' }
        : { work: '💼 工作', ideas: '💡 灵感', study: '📚 学习', prompts: '🤖 提示词', todo: '✅ 待办' };
      return map[c] || L('默认', 'Default');
    }

    function formatRelativeTime(ts) {
      if (!ts) return '';
      const diff = Date.now() - ts;
      if (diff < 60000) return L('刚刚', 'just now');
      if (diff < 3600000) return Math.floor(diff / 60000) + L(' 分钟前', ' min ago');
      if (diff < 86400000) return Math.floor(diff / 3600000) + L(' 小时前', ' h ago');
      return new Date(ts).toLocaleDateString();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.onload = init;
  </script>
</body>
</html>
